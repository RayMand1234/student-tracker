<script type="module">
// Pure derivation module of the dashboard page: every view computes from these, nothing else.
// No imports and only `export function` / `export const`, so the build can inline it in the page.

// Talk circle colour, anchored on the Commander's Talk settings `talk` = {target, yellow} (ticket 08): green at 0 days, lime at
// the target, amber at the yellow threshold, red at yellow + 7, deep red from yellow + 14.
// [day, hue, saturation %, lightness %]
function talkStops({ target, yellow }) {
  const stops = [[0, 140, 55, 38]];
  if (target > 0 && target < yellow) stops.push([target, 78, 62, 42]); // lime only if it comes first
  stops.push([yellow, 38, 88, 48], [yellow + 7, 6, 72, 46], [yellow + 14, 355, 70, 30]);
  return stops;
}

// `days` null = no Talk yet = the deepest red.
function talkColor(days, talk) {
  const stops = talkStops(talk);
  const last = stops.at(-1)[0];
  const x = days === null ? last : Math.min(Math.max(days, 0), last);
  let i = 0;
  while (i < stops.length - 2 && x > stops[i + 1][0]) i++;
  const [a, b] = [stops[i], stops[i + 1]];
  const f = (x - a[0]) / (b[0] - a[0]);
  // Red (6) to deep red (355) goes down through 0, not back through green.
  const hb = b[1] - a[1] > 180 ? b[1] - 360 : b[1];
  const h = (Math.round(a[1] + (hb - a[1]) * f) + 360) % 360;
  const s = Math.round(a[2] + (b[2] - a[2]) * f);
  const l = Math.round(a[3] + (b[3] - a[3]) * f);
  return { bg: `hsl(${h} ${s}% ${l}%)`, ink: inkOn(h, s, l) };
}

// White or black text, whichever contrasts more with the circle (WCAG 2 luminance).
// Pure black: near-black misses 4.5:1 on the orange around yellow + 5.
function inkOn(h, s, l) {
  const a = (s / 100) * Math.min(l / 100, 1 - l / 100);
  const channel = (n) => {
    const k = (n + h / 30) % 12;
    return l / 100 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  const lin = (v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  const lum = (r, g, b) => 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const bg = lum(channel(0), channel(8), channel(4));
  return 1.05 / (bg + 0.05) >= (bg + 0.05) / 0.05 ? '#ffffff' : '#000000';
}

// Whole calendar days between two YYYY-MM-DD dates (never negative). null when no Talk yet.
function daysSince(date, today) {
  if (!date) return null;
  const utc = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
  return Math.max(0, Math.round((utc(today) - utc(date)) / 86_400_000));
}

// Main page: one circle per active Trainee, reddest first (no Talk yet first of all, then most
// days, then by name); Trainees who left only by name.
function talkCircles(cards, talk, today) {
  const isActive = (c) => c.active !== false && !c.left;
  const circles = cards.filter(isActive).map((c) => {
    const days = daysSince(c.lastTalk, today);
    return { id: c.id, name: c.name, days, evalStage: c.evalStage ?? null, color: talkColor(days, talk) };
  });
  circles.sort((a, b) => (b.days ?? Infinity) - (a.days ?? Infinity) || a.name.localeCompare(b.name, 'he'));
  const left = cards.filter((c) => !isActive(c)).map((c) => c.name);
  return { circles, left };
}

// The colour bar under the title: 0 → deep red, a tick at each distinct anchor.
function talkScale(talk) {
  const stops = talkStops(talk);
  const max = stops.at(-1)[0];
  const gradient = Array.from({ length: 11 }, (_, i) => talkColor((i / 10) * max, talk).bg);
  return { max, ticks: stops.map((s) => s[0]), gradient };
}

// A Skill's Rating on `today`, from its card entry `skill` = {a: [[date, score, author], …], n}
// (the counting Assessments, oldest first) — the rule of ticket 05, as the agent applies it:
// the latest Commander Assessment if there is one, else the latest agent one; null = unrated.
// Trend = sign of now − 28 days earlier (null when unrated then); stale = older than 42 days.
function rating(skill, today) {
  const now = ratingAt(skill?.a ?? [], today);
  if (!now) return null;
  const then = ratingAt(skill.a, shiftDate(today, -28));
  return {
    ...now,
    trend: then ? Math.sign(now.score - then.score) : null,
    stale: daysSince(now.date, today) > 42,
    n: skill.n,
  };
}

// The Rating as of the end of `day`: on equal dates the later in the list (written last) wins.
function ratingAt(list, day) {
  const known = list.filter(([date, , author]) => date <= day && author !== 'trainee');
  const commander = known.filter(([, , author]) => author === 'commander');
  const pick = (commander.length ? commander : known).at(-1);
  return pick ? { date: pick[0], score: pick[1], author: pick[2] } : null;
}

function shiftDate(day, days) {
  const d = new Date(Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10) + days));
  return d.toISOString().slice(0, 10);
}

// What stands in a public text where a sensitive sentence was cut out; also shown for any id
// the page can't resolve (it never reads the sensitive records).
const MARK = '[פרט אישי — בתיק]';

const STATUS_LABELS = { good: 'במסלול', watch: 'במעקב', concern: 'דורש טיפול' };

// The Talk settings a Cycle starts with, until the Commander changes them.
const DEFAULT_TALK = { target: 10, yellow: 10, red: 14 };

// The Trainee window (ticket 08): everything it shows, from the card plus `skills` (meta/skills),
// `preset` (meta/preset, for Project names), `teams` and the Trainee's public `evidence`
// (null while it loads). `groups` are the four Stages, then the Interpersonal group.
function traineeWindow(card, { skills, preset, teams = [], evidence, today, talk }) {
  const days = daysSince(card.lastTalk, today);
  const groups = [...(skills?.groups ?? [])].sort((a, b) => a.order - b.order);
  const rated = (ids) => ids
    .map((id) => ({ id, rating: rating(card.skills?.[id], today) }))
    .filter((k) => k.rating);
  const shown = groups.map((g) => {
    const names = Object.fromEntries(g.skills.map((k) => [k.id, k.name]));
    const these = rated(g.skills.map((k) => k.id)).map((k) => ({ ...k, name: names[k.id] }));
    const ids = new Set(these.map((k) => k.id));
    return { id: g.id, name: g.name, rated: these, unrated: g.skills.filter((k) => !k.archived && !ids.has(k.id)).length };
  });
  // A rated Skill the framework doesn't name can't be resolved: shown, as the marker.
  const known = new Set(groups.flatMap((g) => g.skills.map((k) => k.id)));
  const unknown = rated(Object.keys(card.skills ?? {}).filter((id) => !known.has(id))).map((k) => ({ ...k, name: MARK }));
  if (unknown.length) shown.push({ id: null, name: MARK, rated: unknown, unrated: 0 });
  const project = (id) => preset?.projects?.find((p) => p.id === id)?.name ?? MARK;
  const live = evidence ? evidence.filter((e) => e.retracted === false) : null;
  const latest = (kind) => (live ? live.filter((e) => e.kind === kind).sort(byDayDesc)[0]?.excerpt ?? null : null);
  return {
    id: card.id,
    name: card.name,
    color: talkColor(days, talk),
    days,
    evalStage: card.evalStage ?? null,
    snapshot: card.snapshot ?? null,
    status: statusOf(card),
    groups: shown,
    details: {
      lastTalk: card.lastTalk ? { date: card.lastTalk, days } : null,
      teams: teams.filter((t) => (t.members ?? []).includes(card.id))
        .map((t) => `${project(t.project)} · ${t.name}`)
        .sort((a, b) => a.localeCompare(b, 'he')),
      goal: latest('goal'),
      background: latest('background'),
      evidence: live ? { count: live.length, last: [...live].sort(byDayDesc)[0]?.date ?? null } : null,
    },
    next: [
      ...(card.followups ?? []).map((f) => ({ kind: 'followup', text: f.text, date: f.date })),
      ...(card.nextTalk?.questions ?? []).map((q) => ({ kind: 'question', text: q })),
    ],
  };
}

const statusOf = ({ status: s }) => (s ? { value: s.value, label: STATUS_LABELS[s.value] ?? s.value, by: s.by, reason: s.reason } : null);

// The Trainee file (ticket 08, level 3): everything it shows, from the card plus every card
// (`cards`, for the side list and the team line), `skills`, `preset`, `cycle` (meta/cycle, for
// the start date), and the Trainee's live public `evidence` and `changes` (null while loading).
// `kind` filters the timeline. A Trainee who left is read-only: no Talk chip.
function traineeFile(card, { cards, skills, preset, cycle, evidence, changes, today, talk, kind }) {
  const left = isActive(card) ? null : card.left ?? { date: null };
  const days = left ? null : daysSince(card.lastTalk, today);
  const start = cycle?.start ?? today;
  const groups = [...(skills?.groups ?? [])].sort((a, b) => a.order - b.order);
  const row = (id, name) => {
    const s = card.skills?.[id];
    return { id, name, rating: rating(s, today), history: s?.a ?? [], n: s?.n ?? 0 };
  };
  const shown = groups.map((g) => {
    const rows = g.skills.map((k) => row(k.id, k.name)).filter((k, i) => !g.skills[i].archived || k.rating);
    return { id: g.id, name: g.name, mean: mean(rows.filter((k) => k.rating).map((k) => k.rating.score)), skills: rows };
  });
  const known = new Set(groups.flatMap((g) => g.skills.map((k) => k.id)));
  const unknown = Object.keys(card.skills ?? {}).filter((id) => !known.has(id)).map((id) => row(id, MARK)).filter((k) => k.rating);
  if (unknown.length) shown.push({ id: null, name: MARK, mean: mean(unknown.map((k) => k.rating.score)), skills: unknown });
  const items = (k) => (card.items ?? []).filter((i) => i.kind === k).map(({ text, by }) => ({ text, by }));
  return {
    id: card.id,
    name: card.name,
    left,
    days,
    color: left ? null : talkColor(days, talk),
    evalStage: card.evalStage ?? null,
    status: statusOf(card),
    lastTalk: card.lastTalk ?? null,
    snapshot: card.snapshot ?? null,
    start,
    nav: fileNav(cards, { today, talk }),
    growth: growth(card, { cards, skills, start, today }),
    items: { improve: items('improve'), keep: items('keep') },
    followups: (card.followups ?? []).map(({ text, date }) => ({ text, date })),
    skills: shown,
    timeline: timeline(evidence, changes, { preset, kind }),
  };
}

// Newest day first; on the same day, the higher id (written later) first.
function byDayDesc(a, b) {
  return (a.date < b.date ? 1 : a.date > b.date ? -1 : 0) || b.id.localeCompare(a.id, 'en', { numeric: true });
}

// Growth and trends (ticket 08): the card's counting Assessments replayed with the Rating rule at
// the end of each Cycle week (the last week ends today). A line value is the mean Rating over the
// Skills rated by then, per Stage / Interpersonal group and overall; the team line is the mean of
// the active Trainees' values (this one included when active). null = nothing rated yet.
function growth(card, { cards, skills, start, today }) {
  const groups = [...(skills?.groups ?? [])].sort((a, b) => a.order - b.order);
  const weeks = cycleWeeks(start, today);
  const ids = (g) => g.skills.map((k) => k.id);
  const all = groups.flatMap(ids);
  const team = cards.filter(isActive);
  const lineOf = (c, these) => weeks.map((w) => meanAt(c, these, w.end));
  const teamOf = (these) => {
    const lines = team.map((c) => lineOf(c, these));
    return weeks.map((_, i) => mean(lines.map((l) => l[i]).filter((v) => v !== null)));
  };
  const overall = { me: lineOf(card, all), team: teamOf(all) };
  const then = shiftDate(today, -28);
  const now = meanAt(card, all, today);
  const was = meanAt(card, all, then);

  // Each rated Skill's Rating today against 28 days earlier (the Trend baseline).
  const rated = groups.flatMap((g) => g.skills.map((k) => {
    const list = card.skills?.[k.id]?.a ?? [];
    const r = rating(card.skills?.[k.id], today);
    const base = ratingAt(list, then);
    return r && { id: k.id, name: k.name, group: g.name, now: r.score, stale: r.stale, delta: base ? r.score - base.score : null };
  })).filter(Boolean);
  const movers = rated.filter((k) => k.delta)
    .map(({ id, name, group, delta, now: score }) => ({ id, name, group, delta, now: score }))
    .sort((a, b) => b.delta - a.delta);
  const first = overall.me.findIndex((v) => v !== null);
  const ratedIds = new Set(rated.map((k) => k.id));

  return {
    weeks,
    // `change`: this week's value against the first week with one ("since the Cycle started").
    groups: groups.map((g) => {
      const me = lineOf(card, ids(g));
      const from = me.find((v) => v !== null) ?? null;
      const last = me.at(-1);
      return { id: g.id, name: g.name, me, team: teamOf(ids(g)), now: last, change: from !== null && last !== null ? last - from : null };
    }),
    overall,
    average: { now, delta: now !== null && was !== null ? now - was : null, team: overall.team.at(-1) },
    moves: {
      rose: movers.filter((m) => m.delta > 0).length,
      fell: movers.filter((m) => m.delta < 0).length,
      flat: rated.filter((k) => k.delta === 0).length,
      fresh: rated.filter((k) => k.delta === null).length,
    },
    movers,
    coverage: {
      rated: rated.length,
      // Skills in use: every one not archived, and an archived one while it still has a Rating.
      total: groups.flatMap((g) => g.skills).filter((k) => !k.archived || ratedIds.has(k.id)).length,
      firstWeek: first < 0 ? null : first + 1,
      stale: rated.filter((k) => k.stale).length,
    },
  };
}

// The Trainee file's side list: active Trainees by Status (those needing care first, no Status
// last), reddest first within a group as on the circles; then those who left, by name.
function fileNav(cards, { today, talk }) {
  const item = (c) => {
    const left = !isActive(c);
    const days = left ? null : daysSince(c.lastTalk, today);
    return { id: c.id, name: c.name, evalStage: left ? null : c.evalStage ?? null, days, color: left ? null : talkColor(days, talk), left };
  };
  const reddest = (a, b) => (b.days ?? Infinity) - (a.days ?? Infinity) || a.name.localeCompare(b.name, 'he');
  const active = cards.filter(isActive);
  const status = (c) => (STATUS_LABELS[c.status?.value] ? c.status.value : 'none');
  const groups = [
    ...NAV_GROUPS.map(([key, label]) => ({ key, label, items: active.filter((c) => status(c) === key).map(item).sort(reddest) })),
    { key: 'left', label: 'עזבו', items: cards.filter((c) => !isActive(c)).map(item).sort((a, b) => a.name.localeCompare(b.name, 'he')) },
  ];
  return groups.filter((g) => g.items.length);
}

// Evidence kinds as the Commander calls them, in the order the timeline's chips list them.
const KIND_LABELS = {
  talk: 'שיחה', test: 'תרץ', 'code-review': 'סקד', 'project-observation': 'תצפית פרויקט', 'self-assessment': 'רמ"ת',
  'improve-keep': 'שיפור/שימור', goal: 'שאיפות', background: 'רקע', 'evaluation-event': 'תהליך הערכה',
  clarification: 'הבהרה', note: 'הערה', status: 'שינוי סטטוס',
};

// The Trainee file's timeline: their live public Evidence and Status changes (from `changes`),
// newest first; `kind` narrows it to one kind ('all' or a kind not present: everything).
// null while the Evidence loads; with `changes` still loading, the Evidence shows meanwhile.
function timeline(evidence, changes, { preset, kind = 'all' }) {
  if (!evidence) return null;
  const project = (id) => preset?.projects?.find((p) => p.id === id)?.name ?? MARK;
  const detail = (e) => {
    if (e.kind === 'test') {
      const parts = [e.test, e.score ?? (e.test ? '—' : null), e.self ? `לדבריו/ה: ${e.self}` : null].filter((x) => x != null);
      return parts.length ? parts.join(' · ') : null;
    }
    if (e.kind === 'code-review') return e.test ?? null;
    if (e.kind === 'project-observation') return e.project ? project(e.project) : null;
    return null;
  };
  const label = (k) => KIND_LABELS[k] ?? k;
  const status = (v) => (v ? STATUS_LABELS[v] ?? v : null);
  const all = [
    ...evidence.filter((e) => e.retracted === false).map((e) => ({
      id: e.id, date: e.date, at: e.at ?? '', kind: e.kind, label: label(e.kind), text: e.excerpt, detail: detail(e),
    })),
    ...(changes ?? []).filter((c) => c.retracted === false && c.type === 'status').map((c) => ({
      id: c.id, date: String(c.at).slice(0, 10), at: c.at, kind: 'status', label: label('status'),
      text: c.reason ?? '', from: status(c.from), to: status(c.to), by: c.by,
    })),
  ].sort((a, b) => cmp(b.date, a.date) || cmp(b.at, a.at) || b.id.localeCompare(a.id, 'en', { numeric: true }));
  const order = Object.keys(KIND_LABELS);
  const present = [...new Set(all.map((e) => e.kind))]
    .sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  const kinds = present.map((k) => ({ kind: k, label: label(k), count: all.filter((e) => e.kind === k).length }));
  return { kinds, entries: present.includes(kind) ? all.filter((e) => e.kind === kind) : all };
}

const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

const NAV_GROUPS = [['concern', 'דורשים טיפול'], ['watch', 'במעקב'], ['good', 'במסלול'], ['none', 'ללא סטטוס']];

const isActive = (c) => c.active !== false && !c.left;
const mean = (v) => (v.length ? v.reduce((a, b) => a + b, 0) / v.length : null);

// The mean Rating over `ids` as of the end of `day`, or null when none is rated by then.
function meanAt(card, ids, day) {
  return mean(ids.map((id) => ratingAt(card.skills?.[id]?.a ?? [], day)).filter(Boolean).map((r) => r.score));
}

// Cycle weeks up to today: week w ends start + 7w − 1 days, the current one today.
function cycleWeeks(start, today) {
  const from = start && start <= today ? start : today;
  const n = Math.floor(daysSince(from, today) / 7) + 1;
  return Array.from({ length: n }, (_, i) => {
    const end = shiftDate(from, 7 * (i + 1) - 1);
    return { week: i + 1, end: end < today ? end : today };
  });
}

const app = document.getElementById('app');
const win = document.getElementById('win');
const tip = document.getElementById('tip');
const state = {
  ready: false, failed: false, meta: {}, settings: null, cards: [], teams: [],
  evidence: null, evidenceFailed: false, changes: null, changesFailed: false, // the open Trainee's
  fileKind: 'all', tableOpen: false, // the Trainee file's timeline filter and table view
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
// Escaped, with the marker for a cut-out sensitive part shown as a muted chip.
const redact = (s) => esc(s).split(esc(MARK)).join(`<span class="redact">${esc(MARK)}</span>`);
const localToday = () => new Date().toLocaleDateString('sv-SE');
// An archived Cycle is shown as it was on the day it was archived.
const archivedOn = () => (state.meta.cycle?.archived ? (state.meta.cycle.archivedAt ?? '').slice(0, 10) || null : null);
const pageToday = () => archivedOn() ?? localToday();
const archivedBanner = () => (state.meta.cycle?.archived
  ? `<p class="archived" role="note"><b>מחזור בארכיון</b><span>לקריאה בלבד${archivedOn() ? ` · כפי שהיה ב-${ddmm(archivedOn())}` : ''}. עדכונים חדשים נרשמים במחזור הנוכחי.</span></p>`
  : '');
const ddmm = (d) => esc(`${String(d).slice(8, 10)}/${String(d).slice(5, 7)}`);
const talkOf = () => state.settings?.talk ?? DEFAULT_TALK;

// `#t-…` opens that Trainee's window over the circles; `#file:t-…` their full file.
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('file:')) return { file: h.slice(5) };
  return /^t-[a-z0-9]+$/.test(h) ? { open: h } : {};
}

// Draws the page behind the window: `cls` is its layout (`page` = circles and notes, `file`).
// An unchanged page is left alone; a redraw keeps the focused element by id.
let shownApp = '';
function paint(cls, html) {
  if (cls === app.className && html === shownApp) return false;
  const focused = app.contains(document.activeElement) ? document.activeElement.id : null;
  app.className = cls;
  app.innerHTML = html;
  shownApp = html;
  if (focused) document.getElementById(focused)?.focus({ preventScroll: true });
  return true;
}

function note(title, text) {
  paint('page', `<header class="head"><h1>${esc(title)}</h1></header><p class="note">${esc(text)}</p>`);
}

// A Rating square: dark red (1) → green (5), ↑/↓ Trend, faded when stale, a small square when the
// Commander set it, hatched when it rests on one Evidence; gray "·" with no evidence.
function square(r, name) {
  if (!r) return '<span class="rc r0" title="אין תיעוד עדיין">·</span>';
  const score = Number(r.score);
  const cls = ['rc', `r${score}`, r.stale && 'stale', r.n <= 1 && 'thin', r.author === 'commander' && 'cmd'].filter(Boolean).join(' ');
  const arrow = r.trend > 0 ? '↑' : r.trend < 0 ? '↓' : '';
  const title = `${name}: ${score}/5 · ${r.author === 'commander' ? 'דירוג מפקד' : 'הערכת הסוכן'} · ${ddmm(r.date)} · ${r.n} תיעודים${r.stale ? ' · ישן' : ''}${arrow ? ` · ${arrow === '↑' ? 'עלה' : 'ירד'} מול לפני 4 שבועות` : ''}`;
  return `<span class="${cls}" title="${esc(title)}" role="img" aria-label="${esc(title)}">${score}${arrow ? `<i class="tr" aria-hidden="true">${arrow}</i>` : ''}</span>`;
}

const LEGEND = `<div class="legend">
  <span>${[1, 2, 3, 4, 5].map((v) => `<span class="rc key r${v}">${v}</span>`).join('')}</span>
  <span><span class="rc key r0">·</span> אין תיעוד</span>
  <span><span class="rc key r3"><i class="tr">↑</i></span> מגמה מול לפני 4 שבועות</span>
  <span><span class="rc key r3 stale"></span> ישן (מעל 6 שבועות)</span>
  <span><span class="rc key r3 cmd"></span> דירוג מפקד</span>
  <span><span class="rc key r3 thin"></span> תיעוד אחד בלבד</span>
</div>`;

const pill = (s) => (s
  ? `<span class="pill ${esc(s.value)}" title="${esc(`${s.by === 'commander' ? 'קבע המפקד' : 'הערכה'}: ${s.reason ?? ''}`)}"><span class="dot"></span>${esc(s.label)}</span>${s.by === 'commander' ? '' : ' <span class="assess">הערכה</span>'}`
  : '<span class="muted">—</span>');

function windowHtml(w) {
  const d = w.details;
  const skills = w.groups.map((st) => `
      <div class="st"><span class="small muted">${esc(st.name)}</span><div class="row">
        ${st.rated.map((k) => `<span class="one">${square(k.rating, k.name)}${esc(k.name)}</span>`).join('')}
        ${st.unrated ? `<span class="one muted small">${st.rated.length ? '+' : ''}${st.unrated} ללא תיעוד</span>` : ''}
      </div></div>`).join('');
  const next = w.next.map((x) => (x.kind === 'followup'
    ? `<li><span>${redact(x.text)}</span><span class="src">נקודה פתוחה מ-${ddmm(x.date)}</span></li>`
    : `<li><span>${redact(x.text)}</span><span class="src">שאלה מוצעת <span class="assess">הצעה</span></span></li>`)).join('');
  const count = state.evidenceFailed ? '<span class="muted">לא נטען</span>'
    : d.evidence === null ? '<span class="muted">טוען…</span>'
    : d.evidence.count ? `${d.evidence.count}, האחרון ב-${ddmm(d.evidence.last)}` : 'עוד אין';
  return `<div class="win-bg" data-close="1"><div class="win" role="dialog" aria-modal="true" aria-labelledby="win-name">
    <div class="top" style="background:${w.color.bg};color:${w.color.ink}">
      <div class="who"><h1 id="win-name">${esc(w.name)}</h1>${w.evalStage ? `<span class="evtag">${esc(w.evalStage)}</span>` : ''}</div>
      <span class="acts"><button class="btn" data-file="${esc(w.id)}" id="win-file">לתיק המלא</button><button class="btn" data-close="1" id="win-close">סגירה</button></span>
    </div>
    <section><h2>תמונת מצב <span class="assess">הערכה</span></h2>
      ${w.snapshot ? `<p>${redact(w.snapshot.text)}</p>` : '<p class="muted">עוד אין תמונת מצב.</p>'}</section>
    <section><h2>מיומנויות</h2><div class="sk">${skills}</div>${LEGEND}</section>
    <section><h2>פרטים</h2><dl class="info">
      <dt>סטטוס</dt><dd>${pill(w.status)}</dd>
      <dt>תהליך הערכה</dt><dd>${w.evalStage ? esc(w.evalStage) : '—'}</dd>
      <dt>שיחה אחרונה</dt><dd>${d.lastTalk ? `${ddmm(d.lastTalk.date)} · <bdi class="mono">${d.lastTalk.days}</bdi> ימים` : 'טרם נערכה'}</dd>
      <dt>צוות פרויקט</dt><dd>${d.teams.length ? d.teams.map(esc).join('<br>') : '—'}</dd>
      ${d.goal ? `<dt>שאיפות</dt><dd>${redact(d.goal)}</dd>` : ''}
      ${d.background ? `<dt>רקע</dt><dd>${redact(d.background)}</dd>` : ''}
      <dt>תיעודים</dt><dd>${count}</dd>
    </dl></section>
    <section><h2>לשיחה הבאה</h2><ul class="q">${next || '<li class="muted">אין נקודות פתוחות.</li>'}</ul></section>
  </div></div>`;
}

// ---------- Trainee file ----------
const f1 = (v) => (v === null || v === undefined ? '—' : v.toFixed(1));
const signed = (v) => (v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1));
const rVar = (v) => `var(--r${Math.max(1, Math.min(5, Math.round(v)))})`;
const chipOf = (days, color) => (color
  ? `<span class="days" style="background:${color.bg};color:${color.ink}" title="ימים מאז השיחה האחרונה">${days === null ? 'טרם שיחה' : `<bdi class="mono">${days}</bdi> ימים`}</span>`
  : '');
const utcOf = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));

// A line chart on the 1–5 scale, weeks running right to left (Cycle start on the right). Its
// series ride along in data-lc for the hover readout.
function lineChart(series, n, { W = 300, H = 130, axis = true } = {}) {
  const pl = 8, pr = axis ? 22 : 6, pt = 8, pb = axis ? 20 : 6, pw = W - pl - pr, ph = H - pt - pb;
  const x = (i) => W - pr - (n > 1 ? i / (n - 1) : 0) * pw;
  const y = (v) => pt + ((5 - v) / 4) * ph;
  const path = (vals) => {
    let d = '', on = false;
    vals.forEach((v, i) => {
      if (v === null) { on = false; return; }
      d += `${on ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`;
      on = true;
    });
    return d;
  };
  const lastOf = (vals) => { for (let i = vals.length - 1; i >= 0; i--) if (vals[i] !== null) return [i, vals[i]]; return null; };
  const grid = axis
    ? [1, 2, 3, 4, 5].map((v) => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${W - pr + 5}" y="${y(v) + 4}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join('')
      + Array.from({ length: n }, (_, i) => i).filter((i) => i % 4 === 0).map((i) => `<text x="${x(i)}" y="${H - 5}" font-size="10" fill="var(--muted)" text-anchor="middle">ש׳ ${i + 1}</text>`).join('')
      + `<line x1="${pl}" x2="${W - pr}" y1="${pt + ph}" y2="${pt + ph}" stroke="var(--axis)" stroke-width="1"/>`
    : '';
  const marks = series.map((s) => `<path d="${path(s.vals)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('')
    + series.filter((s) => s.dot).map((s) => { const l = lastOf(s.vals); return l ? `<circle cx="${x(l[0])}" cy="${y(l[1])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>` : ''; }).join('')
    // A single rated week draws no line: mark each series' point so it still shows.
    + series.map((s) => s.vals.map((v, i) => (v !== null && s.vals[i - 1] == null && s.vals[i + 1] == null ? `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${s.color}"/>` : '')).join('')).join('');
  const data = esc(JSON.stringify({ W, pl, pr, n, s: series.map((s) => ({ n: s.name, c: s.color, v: s.vals })) }));
  const label = series.map((s) => `${s.name}: ${f1(lastOf(s.vals)?.[1])}`).join(', ');
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" direction="ltr" data-lc="${data}" role="img" aria-label="${esc(label)}">${grid}${marks}
    <line class="xh" x1="0" x2="0" y1="${pt}" y2="${pt + ph}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/></svg>`;
}

// A Skill's history strip: each counting Assessment from the Cycle start (right) to today (left);
// a circle for the agent's, a square for the Commander's.
function histSvg(list, start, today, w = 160, h = 22) {
  const s = utcOf(start), e = Math.max(utcOf(today), s + 1);
  const x = (d) => 6 + (w - 12) * (1 - (Math.min(Math.max(utcOf(d), s), e) - s) / (e - s));
  const y = (v) => h - 4 - (v - 1) * ((h - 8) / 4);
  const pts = list.map(([d, v]) => [x(d).toFixed(1), y(v).toFixed(1)]);
  return `<svg class="hist" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="4" x2="${w - 4}" y1="${h - 4}" y2="${h - 4}" stroke="var(--line)" stroke-width="1"/>
    ${pts.length > 1 ? `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1" opacity=".6"/>` : ''}
    ${list.map(([, v, a], i) => (a === 'commander'
      ? `<rect x="${pts[i][0] - 4}" y="${pts[i][1] - 4}" width="8" height="8" fill="${rVar(v)}" stroke="var(--fg)" stroke-width="1"/>`
      : `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="${rVar(v)}"/>`)).join('')}
  </svg>`;
}

function growthHtml(f) {
  const g = f.growth;
  const n = g.weeks.length;
  const me = (vals) => ({ name: f.name, color: 'var(--s1)', vals, dot: true });
  const team = (vals) => ({ name: 'ממוצע הצוות', color: 'var(--cmp)', vals });
  const { average: a, moves: m, coverage: c } = g;
  const delta = a.delta === null ? 'אין בסיס להשוואה'
    : `${a.delta > 0 ? '↑ ' : a.delta < 0 ? '↓ ' : ''}${signed(a.delta)} מול לפני 4 שבועות`;
  const tiles = `<div class="G-tiles">
      <div class="G-tile"><span class="lbl">ממוצע כל המיומנויות</span><span class="val">${f1(a.now)}</span>
        <span class="delta">${delta} · צוות ${f1(a.team)}</span>
        ${lineChart([team(g.overall.team), me(g.overall.me)], n, { W: 240, H: 46, axis: false })}</div>
      <div class="G-tile"><span class="lbl">ב-4 השבועות האחרונים</span><span class="val">${m.rose} <small>עלו</small> · ${m.fell} <small>ירדו</small></span>
        <span class="delta">${m.flat} ללא שינוי · ${m.fresh} חדשות (בלי בסיס)</span></div>
      <div class="G-tile"><span class="lbl">מכוסות בתיעוד</span><span class="val">${c.rated}/${c.total}</span>
        <span class="delta">${c.firstWeek ? `דירוג ראשון בשבוע ${c.firstWeek}` : 'עוד אין דירוגים'} · ${c.stale} ישנים</span></div>
    </div>`;
  const panels = g.groups.map((p) => `<div class="G-panel"><div class="t"><span>${esc(p.name)}</span><span class="v"><bdi class="mono">${f1(p.now)}</bdi>${p.change ? ` (<bdi class="mono">${signed(p.change)}</bdi> מתחילת המחזור)` : ''}</span></div>
      ${lineChart([team(p.team), me(p.me)], n)}</div>`).join('');
  const table = `<details id="g-table"${state.tableOpen ? ' open' : ''}><summary class="small muted">הצג כטבלה</summary><div class="G-tbl"><table>
      <thead><tr><th>שבוע</th>${g.groups.map((p) => `<th>${esc(p.name)}</th>`).join('')}<th>הכל</th><th>צוות</th></tr></thead>
      <tbody>${g.weeks.map((w, i) => `<tr><td>${w.week}</td>${g.groups.map((p) => `<td>${f1(p.me[i])}</td>`).join('')}<td>${f1(g.overall.me[i])}</td><td>${f1(g.overall.team[i])}</td></tr>`).join('')}</tbody>
    </table></div></details>`;
  const movers = g.movers.length
    ? g.movers.map((k) => `<div class="row" data-tip="${esc(`${k.name} · ${k.group}|${k.delta > 0 ? 'עלה' : 'ירד'} ${Math.abs(k.delta)} מול לפני 4 שבועות, עכשיו ${k.now}`)}">
        <span>${esc(k.name)} <span class="small muted">${esc(k.group)}</span></span>
        <span class="track"><span class="bar ${k.delta > 0 ? 'up' : 'dn'}" style="width:${(Math.abs(k.delta) / 4) * 50}%"></span></span>
        <span class="v">${k.delta > 0 ? `↑ +${k.delta}` : `↓ ${k.delta}`}</span></div>`).join('')
    : '<p class="muted small">אין שינויים ב-4 השבועות האחרונים.</p>';
  return `<section class="sec"><div class="sec-head"><h2>צמיחה ומגמות</h2><span class="small muted">ממוצע הדירוגים בסוף כל שבוע · ימין = תחילת המחזור</span></div>
    ${tiles}
    <div class="G-key"><span><i style="background:var(--s1)"></i>${esc(f.name)}</span><span><i style="background:var(--cmp)"></i>ממוצע הצוות</span></div>
    <div class="G-mult">${panels}</div>
    ${table}
    <div class="panel G-mv"><h3>מה זז ב-4 השבועות האחרונים</h3>${movers}</div>
  </section>`;
}

function timelineHtml(f) {
  if (state.evidenceFailed) return '<p class="muted">התיעודים לא נטענו.</p>';
  const t = f.timeline;
  if (!t) return '<p class="muted">טוען…</p>';
  const chips = t.kinds.length ? `<div class="chips" role="group" aria-label="סינון לפי סוג">${[{ kind: 'all', label: 'הכל' }, ...t.kinds].map((k) => {
    const on = state.fileKind === k.kind || (k.kind === 'all' && !t.kinds.some((x) => x.kind === state.fileKind));
    return `<button class="chip" id="k-${esc(k.kind)}" data-kind="${esc(k.kind)}" aria-pressed="${on}">${esc(k.label)}${k.count ? ` <span class="mono">${k.count}</span>` : ''}</button>`;
  }).join('')}</div>` : '';
  const item = (e) => {
    const head = e.kind === 'status'
      ? `<b>${e.from ? `${esc(e.from)} ← ` : 'נקבע: '}${esc(e.to)}</b><span class="assess">${e.by === 'commander' ? 'מפקד' : 'הערכה'}</span>`
      : e.detail ? `<span class="small muted">${redact(e.detail)}</span>` : '';
    return `<li><span class="when">${ddmm(e.date)}</span><div class="what"><div class="hd"><span class="kind${e.kind === 'status' ? ' status' : ''}">${esc(e.label)}</span>${head}</div>
      ${e.text ? `<p>${redact(e.text)}</p>` : ''}</div></li>`;
  };
  return `${chips}${state.changesFailed ? '<p class="small muted">שינויי הסטטוס לא נטענו.</p>' : ''}
    <div class="panel">${t.entries.length ? `<ul class="feed">${t.entries.map(item).join('')}</ul>` : '<p class="muted">עוד אין תיעודים.</p>'}</div>`;
}

function fileHtml(f, cycle, weeksTotal) {
  const nav = `<nav class="f-nav" aria-label="חניכים">
      <div class="cyc"><h2>${esc(cycle.name)}</h2><span class="small muted">שבוע ${f.growth.weeks.length}${weeksTotal ? `/${weeksTotal}` : ''}</span></div>
      <ul class="f-list">
        <li><a class="f-item home" id="nav-home" href="#">→ לעיגולי השיחות</a></li>
        ${f.nav.map((grp) => `<li class="gh"><h3>${esc(grp.label)}</h3></li>${grp.items.map((t) => `<li><a class="f-item${t.left ? ' gone' : ''}" id="nav-${esc(t.id)}" href="#file:${esc(t.id)}"${t.id === f.id ? ' aria-current="page"' : ''}>
          <span class="nm"><span class="dot ${esc(grp.key)}" aria-hidden="true"></span>${esc(t.name)}${t.evalStage ? ` <span class="evtag">${esc(t.evalStage)}</span>` : ''}</span>${chipOf(t.days, t.color)}</a></li>`).join('')}`).join('')}
      </ul></nav>`;
  const sub = f.left
    ? `עזב/ה${f.left.date ? ` ב-${ddmm(f.left.date)}` : ''}${f.left.reason ? ` · ${redact(f.left.reason)}` : ''} · לא נכלל בממוצע הצוות`
    : f.lastTalk ? `שיחה אחרונה ${ddmm(f.lastTalk)}` : 'טרם נערכה שיחה';
  const head = `<section class="f-hdr">
      <div class="meta"><h1 id="file-name">${esc(f.name)}</h1>${f.status ? pill(f.status) : ''}${f.evalStage ? `<span class="evtag">${esc(f.evalStage)}</span>` : ''}${chipOf(f.days, f.color)}</div>
      <span class="small muted">${sub}</span>
      ${f.snapshot
        ? `<div><span class="assess">הערכה</span> <span class="small muted">תמונת מצב · ${ddmm(String(f.snapshot.at).slice(0, 10))}</span><p class="f-snap">${redact(f.snapshot.text)}</p></div>`
        : '<p class="muted">עוד אין תמונת מצב.</p>'}
    </section>`;
  const list = (items) => (items.length
    ? items.map((i) => `<li>${redact(i.text)}${i.by === 'agent' ? ' <span class="assess">הצעה</span>' : ''}</li>`).join('')
    : '<li class="muted">—</li>');
  const keep = `<section class="two">
      <div class="panel"><h2>שיפור</h2><ul class="bul">${list(f.items.improve)}</ul></div>
      <div class="panel"><h2>שימור</h2><ul class="bul">${list(f.items.keep)}</ul></div>
    </section>`;
  const open = f.followups.length
    ? `<section class="panel"><h2>נקודות פתוחות</h2><ul class="bul">${f.followups.map((x) => `<li>${redact(x.text)} <span class="small muted">מ-${ddmm(x.date)}</span></li>`).join('')}</ul></section>`
    : '';
  const today = pageToday();
  const skills = `<section class="sec"><div class="sec-head"><h2>מיומנויות לאורך המחזור</h2>${LEGEND}</div>
      <div class="f-stages">${f.skills.map((st) => `<div class="f-stage"><h3>${esc(st.name)} <span class="mono small muted">${f1(st.mean)}</span></h3>
        ${st.skills.map((k) => `<div class="f-sk"><span class="lbl">${esc(k.name)}</span>${square(k.rating, k.name)}${k.history.length ? histSvg(k.history, f.start, today) : '<span class="nohist small muted">אין תיעוד</span>'}<span class="n">${k.n ? `<bdi class="mono">${k.n}</bdi> ${k.n === 1 ? 'תיעוד' : 'תיעודים'}` : ''}</span></div>`).join('')}
      </div>`).join('')}</div>
      <p class="small muted">קו הזמן: ימין = תחילת המחזור (${ddmm(f.start)}), שמאל = ${archivedOn() ? 'יום הארכוב' : 'היום'}. עיגול = הסוכן, ריבוע = מפקד.</p></section>`;
  return `${nav}<div class="f-main">${head}${growthHtml(f)}${keep}${open}${skills}
    <section class="sec"><h2>ציר זמן</h2>${timelineHtml(f)}</section></div>`;
}

// One readout for every chart: the week under the pointer on a line chart, the row on the movers.
function showTip(lines, cx, cy) {
  tip.replaceChildren(...lines.map(([text, color], i) => {
    const s = document.createElement('span');
    s.style.cssText = `display:flex;gap:6px;align-items:center${i === 0 ? ';font-weight:600' : ''}`;
    if (color) {
      const k = document.createElement('i');
      k.style.cssText = `width:12px;height:2px;border-radius:1px;background:${color}`;
      s.append(k);
    }
    s.append(document.createTextNode(text));
    return s;
  }));
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = `${Math.min(window.innerWidth - r.width - 8, Math.max(8, cx - r.width / 2))}px`;
  tip.style.top = `${Math.max(8, cy - r.height - 14)}px`;
}
function hideTip() {
  if (tip.hidden) return;
  tip.hidden = true;
  document.querySelectorAll('.lc .xh').forEach((l) => l.setAttribute('visibility', 'hidden'));
}
document.addEventListener('pointermove', (e) => {
  const row = e.target.closest?.('[data-tip]');
  if (row) { const [a, b] = row.dataset.tip.split('|'); return showTip([[a], [b]], e.clientX, row.getBoundingClientRect().top); }
  const svg = e.target.closest?.('svg[data-lc]');
  if (!svg) return hideTip();
  const m = JSON.parse(svg.dataset.lc);
  const r = svg.getBoundingClientRect();
  const k = m.W / r.width, pw = m.W - m.pl - m.pr;
  const i = Math.max(0, Math.min(m.n - 1, Math.round(((m.W - m.pr - (e.clientX - r.left) * k) / pw) * (m.n - 1))));
  const xx = m.W - m.pr - (m.n > 1 ? i / (m.n - 1) : 0) * pw;
  svg.querySelectorAll('.xh').forEach((l) => { l.setAttribute('x1', xx); l.setAttribute('x2', xx); l.setAttribute('visibility', 'visible'); });
  showTip([[`שבוע ${i + 1}`], ...[...m.s].reverse().map((s) => [`${s.n}: ${f1(s.v[i])}`, s.c])], r.left + xx / k, r.top);
});
document.addEventListener('pointerleave', hideTip);
window.addEventListener('scroll', hideTip, { passive: true });
// The table view stays open across live updates.
document.addEventListener('toggle', (e) => { if (e.target.id === 'g-table') state.tableOpen = e.target.open; }, true);

let shownWindow = '';
function renderWindow() {
  const { open } = route();
  const card = open && state.ready && state.cards.find((c) => c.id === open);
  const html = card
    ? windowHtml(traineeWindow(card, {
      skills: state.meta.skills, preset: state.meta.preset, teams: state.teams, evidence: state.evidence, today: pageToday(), talk: talkOf(),
    }))
    : '';
  if (html === shownWindow) return; // unchanged: leave the DOM alone
  // A live update redraws the window: keep its focus and scroll where they were.
  const focused = win.contains(document.activeElement) ? document.activeElement.id : null;
  const scrolled = win.firstElementChild?.scrollTop ?? 0;
  const opening = !shownWindow && html;
  shownWindow = html;
  win.innerHTML = html;
  document.body.classList.toggle('locked', Boolean(html));
  app.inert = Boolean(html); // the window is modal: nothing behind it takes focus or clicks
  if (!html) return;
  win.firstElementChild.scrollTop = opening ? 0 : scrolled;
  document.getElementById(opening ? 'win-close' : focused)?.focus();
}

// After the window closes, focus goes back to the circle that opened it, once the circles are drawn.
let returnTo = null;
// The Trainee whose file was just opened, until it is drawn.
let navTo = null;

function render() {
  renderWindow();
  if (state.failed) return note('מעקב חניכים', 'החיבור לנתונים נקטע. רענן את העמוד.');
  if (!state.ready) return;
  const { cards } = state;
  const cycle = state.meta.cycle;
  if (!cycle) return note('מעקב חניכים', 'המעקב עוד לא הוקם. הרץ /student-tracker:setup ב-Claude Code.');
  if (cycle.setup !== 'done') return note(cycle.name, 'ההקמה עדיין בתהליך. העמוד יתמלא כשהיא תסתיים.');
  const { file } = route();
  const fileOf = file && cards.find((c) => c.id === file);
  if (fileOf) {
    const f = traineeFile(fileOf, {
      cards, skills: state.meta.skills, preset: state.meta.preset, cycle, evidence: state.evidence, changes: state.changes,
      today: pageToday(), talk: talkOf(), kind: state.fileKind,
    });
    paint('file', archivedBanner() + fileHtml(f, cycle, state.meta.preset?.schedule?.length));
    if (navTo === file) { // just opened: on a phone the side list is a row; bring this Trainee into view
      navTo = null;
      app.querySelector('.f-item[aria-current]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    return;
  }
  const talk = talkOf();
  const { circles, left } = talkCircles(cards, talk, pageToday());
  const { max, ticks, gradient } = talkScale(talk);

  const ring = circles.length
    ? `<ul class="ring">${circles.map((c) => `
        <li><button class="c" data-open="${esc(c.id)}" style="background:${c.color.bg};color:${c.color.ink}"
            aria-label="${esc(c.name)}, ${c.days === null ? 'טרם שיחה' : `${c.days} ימים מאז שיחה`}">
          ${c.evalStage ? `<i class="ev">${esc(c.evalStage)}</i>` : ''}
          <b>${esc(c.name)}</b><span>${c.days === null ? 'טרם שיחה' : `<bdi class="n">${c.days}</bdi> ימים`}</span>
        </button></li>`).join('')}</ul>`
    : `<p class="note">עוד אין חניכים במחזור. אפשר להוסיף בצ'אט: "תוסיף חניכה בשם נועה".</p>`;

  paint('page', `${archivedBanner()}
    <header class="head">
      <h1>${esc(cycle.name)}</h1>
      <span class="sub">ימים מאז השיחה האחרונה · יעד: כל ${esc(talk.target)} ימים</span>
      <div class="scale" aria-hidden="true">
        <div class="bar" style="background:linear-gradient(to left, ${gradient.join(', ')})"></div>
        <div class="ticks">${ticks.map((v) => `<span style="right:${(v / max) * 100}%">${v === max ? `${v}+` : v}</span>`).join('')}</div>
      </div>
    </header>
    ${ring}
    ${left.length ? `<p class="left">עזבו: ${left.map(esc).join(', ')}</p>` : ''}`);
  if (returnTo && !route().open) {
    document.querySelector(`[data-open="${CSS.escape(returnTo)}"]`)?.focus();
    returnTo = null;
  }
}

const go = (hash) => { location.hash = hash; };
// A window opened from a circle on this page closes by going back, so Back never reopens it;
// one opened from a link closes by dropping the hash.
let openedHere = false;
const close = () => {
  if (openedHere) history.back();
  else go('');
};
document.addEventListener('click', (e) => {
  const k = e.target.closest('[data-kind]');
  if (k) { state.fileKind = k.dataset.kind; render(); return; }
  const t = e.target.closest('[data-open], [data-file], [data-close], [data-home]');
  if (!t) return;
  // A click inside the window closes it only on its close button, not anywhere on the sheet.
  if (t.dataset.close && t.classList.contains('win-bg') && e.target !== t) return;
  if (t.dataset.open) { openedHere = true; go(t.dataset.open); }
  else if (t.dataset.file) go(`file:${t.dataset.file}`);
  else if (t.dataset.close) close();
  else go('');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && route().open) close(); });

// Read-only and live. Subscribes once each, and to one Trainee's Evidence while their window is
// open; never touches raw Entries or sensitive records.
const db = window.claude?.use ? await window.claude.use('db') : null;
if (!db) {
  note('מעקב חניכים', 'אין גישה לנתוני המעקב בתצוגה הזו. פתח את העמוד מחשבון ה-claude.ai שלך.');
} else {
  let pending = 4;
  const loaded = () => { if (--pending === 0) state.ready = true; render(); };
  const once = (fn) => { let first = true; return (v) => { fn(v); if (first) { first = false; loaded(); } else render(); }; };
  const failed = () => { state.failed = true; render(); };
  db.collection('meta').onSnapshot(once((snap) => {
    state.meta = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
  }), failed);
  db.doc('commander/settings').onSnapshot(once((s) => { state.settings = s.exists ? s.data() : null; }), failed);
  db.collection('trainees').onSnapshot(once((snap) => {
    state.cards = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  }), failed);
  db.collection('teams').onSnapshot(once((snap) => {
    state.teams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  }), failed);

  // One Trainee's live records of one subcollection, in state[field]; null = none open or loading.
  const subscription = (field, sub) => {
    let current = null;
    let stop = () => {};
    return (tid) => {
      if (tid === current) return;
      stop();
      current = tid;
      state[field] = null;
      state[`${field}Failed`] = false;
      stop = tid
        ? db.collection(`trainees/${tid}/${sub}`).where('retracted', '==', false).onSnapshot((snap) => {
          state[field] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          render();
        }, () => { state[`${field}Failed`] = true; render(); })
        : () => {};
    };
  };
  const evidenceOf = subscription('evidence', 'evidence'); // while their window or file is open
  const changesOf = subscription('changes', 'changes'); // Status changes, while their file is open
  let watching = null;
  let filed = null;
  const follow = () => {
    const { open, file } = route();
    if (open !== watching) {
      if (watching && !open) { returnTo = watching; openedHere = false; } // closed, however it was
      watching = open;
    }
    evidenceOf(open ?? file ?? null);
    changesOf(file ?? null);
    if (file !== filed) {
      filed = file;
      state.fileKind = 'all';
      hideTip();
      navTo = file;
      if (file) window.scrollTo(0, 0);
    }
    render();
  };
  window.addEventListener('hashchange', follow);
  follow();
  setInterval(render, 60 * 60 * 1000); // days roll over without any write
}
</script>
