<style>
/* Layout: one centred column; the circles are the page. Calm greens around loud Talk colours. */
:root {
  --bg: #f2f3ef; --surface: #ffffff; --fg: #1b201c; --muted: #5d665e; --line: #d3d8cd;
  --concern: #b3261e;
  --surface-2: #e8eae3; --accent: #2d5b4e;
  --good: #2f8a4a; --watch: #b97c06;
  --r0: #d6d9d1; --r0-ink: #7a8079;
  --r1: #6b0e17; --r2: #c43a2c; --r3: #e6a21a; --r4: #7dc142; --r5: #10bf4c;
  --r1-ink: #ffffff; --r2-ink: #ffffff; --r3-ink: #2a1f05; --r4-ink: #13240a; --r5-ink: #ffffff;
  --shadow: 0 1px 2px rgb(20 30 20 / .06), 0 4px 16px rgb(20 30 20 / .06);
  --display: "Secular One", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111412; --surface: #191d1a; --fg: #e5e9e2; --muted: #98a198; --line: #303730;
    --concern: #f06a5f;
    --surface-2: #222723; --accent: #82bba7;
    --good: #5cc27a; --watch: #e2ad45;
    --r0: #343a35; --r0-ink: #8c958c;
    --r1: #8c1d27; --r2: #d24a3b; --r3: #e9a925; --r4: #7fc64a; --r5: #1fd660;
    --r1-ink: #ffffff; --r2-ink: #ffffff; --r3-ink: #241a03; --r4-ink: #10200a; --r5-ink: #062410;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111412; --surface: #191d1a; --fg: #e5e9e2; --muted: #98a198; --line: #303730;
  --concern: #f06a5f;
  --surface-2: #222723; --accent: #82bba7;
  --good: #5cc27a; --watch: #e2ad45;
  --r0: #343a35; --r0-ink: #8c958c;
  --r1: #8c1d27; --r2: #d24a3b; --r3: #e9a925; --r4: #7fc64a; --r5: #1fd660;
  --r1-ink: #ffffff; --r2-ink: #ffffff; --r3-ink: #241a03; --r4-ink: #10200a; --r5-ink: #062410;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.page { display: grid; gap: 28px; justify-items: center; text-align: center; max-width: 900px; margin-inline: auto; }
.head { display: grid; gap: 6px; justify-items: center; }
.sub { color: var(--muted); font-size: .9rem; }
.scale { display: grid; gap: 4px; width: min(420px, 100%); }
.scale .bar { height: 10px; border-radius: 5px; }
.scale .ticks { position: relative; height: 1.2em; font-size: .75rem; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.scale .ticks span { position: absolute; transform: translateX(50%); white-space: nowrap; }
.ring {
  /* Circle size: three fit a row on a 400px phone, five or six on a laptop. */
  --d: clamp(92px, 26vw, 136px);
  list-style: none; margin: 0; padding: 8px 0; width: 100%;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: clamp(12px, 3vw, 26px);
}
.ring > li { display: contents; }
.c {
  flex: none; width: var(--d); height: var(--d); border-radius: 50%; border: 0; cursor: pointer; font: inherit;
  display: grid; place-content: center; justify-items: center; gap: 2px; padding: 10px;
  box-shadow: var(--shadow); position: relative; transition: transform .15s ease;
}
.c:hover { transform: scale(1.05); }
@media (prefers-reduced-motion: reduce) { .c { transition: none; } .c:hover { transform: none; } }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.c b { font-family: var(--display); font-weight: 400; font-size: clamp(1rem, 3.6vw, 1.3rem); line-height: 1.1; overflow-wrap: anywhere; }
.c span { font-size: .8rem; opacity: .92; }
.c .n { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.c .ev { position: absolute; inset-block-start: 4px; left: 50%; transform: translateX(-50%); font-family: var(--body); font-style: normal; font-size: .66rem; font-weight: 700; background: var(--surface); color: var(--concern); padding: 0 6px; border-radius: 3px; white-space: nowrap; }
.left { font-size: .82rem; color: var(--muted); margin: 0; }
.note { color: var(--muted); max-width: 46ch; margin: 0; }

/* Shared atoms: Rating squares, Status pill, tags (as in the prototype). */
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.rc { display: inline-grid; place-items: center; width: 30px; height: 26px; border-radius: 4px; font-family: var(--mono); font-weight: 600; font-size: .85rem; position: relative; flex: none; }
.rc.r0 { background: var(--r0); color: var(--r0-ink); }
.rc.r1 { background: var(--r1); color: var(--r1-ink); } .rc.r2 { background: var(--r2); color: var(--r2-ink); }
.rc.r3 { background: var(--r3); color: var(--r3-ink); } .rc.r4 { background: var(--r4); color: var(--r4-ink); }
.rc.r5 { background: var(--r5); color: var(--r5-ink); }
.rc .tr { position: absolute; inset-block-start: -7px; inset-inline-start: -5px; font-style: normal; font-size: .7rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 50%; width: 15px; height: 15px; display: grid; place-items: center; line-height: 1; }
.rc.stale { opacity: .38; }
.rc.thin { background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgb(255 255 255 / .38) 4px 6px); }
.rc.cmd::after { content: ""; position: absolute; inset-block-end: 2px; inset-inline-end: 2px; width: 6px; height: 6px; border-radius: 1px; background: currentColor; }
.rc.key { width: 22px; height: 20px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.watch { color: var(--watch); } .pill.concern { color: var(--concern); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: currentColor; }
.evtag { font-size: .72rem; font-weight: 700; background: var(--surface); color: var(--concern); padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.assess { font-family: var(--body); font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; font-weight: 400; }
.redact { background: var(--surface-2); color: var(--muted); border-radius: 3px; padding: 0 4px; font-size: .9em; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Trainee window: a sheet over the circles, header in the circle's colour. */
.win-bg { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .5); display: grid; justify-items: center; align-items: start; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(28px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 100px max(12px, env(safe-area-inset-left, 0px)); }
.win { background: var(--bg); width: min(760px, 100%); border-radius: 12px; box-shadow: var(--shadow); display: grid; gap: 20px; padding: 0 0 22px; overflow: hidden; text-align: start; }
.win > .top { padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.win > .top .who { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.win > .top .acts { display: inline-flex; gap: 8px; }
.win > section { padding-inline: 22px; display: grid; gap: 8px; }
.win h2 { font-family: var(--display); font-weight: 400; font-size: 1.05rem; margin: 0; }
.win p { margin: 0; max-width: 65ch; }
.btn { background: rgb(255 255 255 / .85); color: #1b201c; border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
.btn.plain { background: var(--surface-2); color: var(--fg); }
.sk { display: grid; gap: 10px; }
.sk .st { display: grid; gap: 4px; }
.sk .row { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sk .one { display: inline-flex; gap: 6px; align-items: center; font-size: .86rem; }
.info { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.info dt { color: var(--muted); font-size: .86rem; }
.info dd { margin: 0; min-width: 0; }
.q { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.q li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px; }
.q .src { font-size: .74rem; color: var(--muted); }
body.locked { overflow: hidden; }
</style>

<main class="page" dir="rtl" lang="he" id="app">
  <header class="head"><h1>מעקב חניכים</h1><p class="sub">טוען את המחזור…</p></header>
</main>
<div id="win" dir="rtl" lang="he"></div>

<script type="module">
/* @inline derive.mjs */

const app = document.getElementById('app');
const win = document.getElementById('win');
const state = { ready: false, failed: false, meta: {}, settings: null, cards: [], teams: [], evidence: null, evidenceFailed: false };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
// Escaped, with the marker for a cut-out sensitive part shown as a muted chip.
const redact = (s) => esc(s).split(esc(MARK)).join(`<span class="redact">${esc(MARK)}</span>`);
const localToday = () => new Date().toLocaleDateString('sv-SE');
const ddmm = (d) => esc(`${String(d).slice(8, 10)}/${String(d).slice(5, 7)}`);
const talkOf = () => state.settings?.talk ?? DEFAULT_TALK;

// `#t-…` opens that Trainee's window over the circles; `#file:t-…` their full file.
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('file:')) return { file: h.slice(5) };
  return /^t-[a-z0-9]+$/.test(h) ? { open: h } : {};
}

function note(title, text) {
  app.innerHTML = `<header class="head"><h1>${esc(title)}</h1></header><p class="note">${esc(text)}</p>`;
}

// A Rating square: dark red (1) → green (5), ↑/↓ Trend, faded when stale, a small square when the
// Commander set it, hatched when it rests on one Evidence; gray "·" with no evidence.
function square(r, name) {
  if (!r) return '<span class="rc r0" title="אין תיעוד עדיין">·</span>';
  const score = Number(r.score);
  const cls = ['rc', `r${score}`, r.stale && 'stale', r.n <= 1 && 'thin', r.author === 'commander' && 'cmd'].filter(Boolean).join(' ');
  const arrow = r.trend > 0 ? '↑' : r.trend < 0 ? '↓' : '';
  const title = `${name}: ${score}/5 · ${r.author === 'commander' ? 'דירוג מפקד' : 'הערכת הסוכן'} · ${ddmm(r.date)} · ${r.n} תיעודים${r.stale ? ' · ישן' : ''}${arrow ? ` · ${arrow === '↑' ? 'עלה' : 'ירד'} מול לפני 4 שבועות` : ''}`;
  return `<span class="${cls}" title="${esc(title)}" role="img" aria-label="${esc(title)}">${score}${arrow ? `<i class="tr" aria-hidden="true">${arrow}</i>` : ''}</span>`;
}

const LEGEND = `<div class="legend">
  <span>${[1, 2, 3, 4, 5].map((v) => `<span class="rc key r${v}">${v}</span>`).join('')}</span>
  <span><span class="rc key r0">·</span> אין תיעוד</span>
  <span><span class="rc key r3"><i class="tr">↑</i></span> מגמה מול לפני 4 שבועות</span>
  <span><span class="rc key r3 stale"></span> ישן (מעל 6 שבועות)</span>
  <span><span class="rc key r3 cmd"></span> דירוג מפקד</span>
  <span><span class="rc key r3 thin"></span> תיעוד אחד בלבד</span>
</div>`;

const pill = (s) => (s
  ? `<span class="pill ${esc(s.value)}" title="${esc(`${s.by === 'commander' ? 'קבע המפקד' : 'הערכה'}: ${s.reason ?? ''}`)}"><span class="dot"></span>${esc(s.label)}</span>${s.by === 'commander' ? '' : ' <span class="assess">הערכה</span>'}`
  : '<span class="muted">—</span>');

function windowHtml(w) {
  const d = w.details;
  const skills = w.groups.map((st) => `
      <div class="st"><span class="small muted">${esc(st.name)}</span><div class="row">
        ${st.rated.map((k) => `<span class="one">${square(k.rating, k.name)}${esc(k.name)}</span>`).join('')}
        ${st.unrated ? `<span class="one muted small">${st.rated.length ? '+' : ''}${st.unrated} ללא תיעוד</span>` : ''}
      </div></div>`).join('');
  const next = w.next.map((x) => (x.kind === 'followup'
    ? `<li><span>${redact(x.text)}</span><span class="src">נקודה פתוחה מ-${ddmm(x.date)}</span></li>`
    : `<li><span>${redact(x.text)}</span><span class="src">שאלה מוצעת <span class="assess">הצעה</span></span></li>`)).join('');
  const count = state.evidenceFailed ? '<span class="muted">לא נטען</span>'
    : d.evidence === null ? '<span class="muted">טוען…</span>'
    : d.evidence.count ? `${d.evidence.count}, האחרון ב-${ddmm(d.evidence.last)}` : 'עוד אין';
  return `<div class="win-bg" data-close="1"><div class="win" role="dialog" aria-modal="true" aria-labelledby="win-name">
    <div class="top" style="background:${w.color.bg};color:${w.color.ink}">
      <div class="who"><h1 id="win-name">${esc(w.name)}</h1>${w.evalStage ? `<span class="evtag">${esc(w.evalStage)}</span>` : ''}</div>
      <span class="acts"><button class="btn" data-file="${esc(w.id)}" id="win-file">לתיק המלא</button><button class="btn" data-close="1" id="win-close">סגירה</button></span>
    </div>
    <section><h2>תמונת מצב <span class="assess">הערכה</span></h2>
      ${w.snapshot ? `<p>${redact(w.snapshot.text)}</p>` : '<p class="muted">עוד אין תמונת מצב.</p>'}</section>
    <section><h2>מיומנויות</h2><div class="sk">${skills}</div>${LEGEND}</section>
    <section><h2>פרטים</h2><dl class="info">
      <dt>סטטוס</dt><dd>${pill(w.status)}</dd>
      <dt>תהליך הערכה</dt><dd>${w.evalStage ? esc(w.evalStage) : '—'}</dd>
      <dt>שיחה אחרונה</dt><dd>${d.lastTalk ? `${ddmm(d.lastTalk.date)} · <bdi class="mono">${d.lastTalk.days}</bdi> ימים` : 'טרם נערכה'}</dd>
      <dt>צוות פרויקט</dt><dd>${d.teams.length ? d.teams.map(esc).join('<br>') : '—'}</dd>
      ${d.goal ? `<dt>שאיפות</dt><dd>${redact(d.goal)}</dd>` : ''}
      ${d.background ? `<dt>רקע</dt><dd>${redact(d.background)}</dd>` : ''}
      <dt>תיעודים</dt><dd>${count}</dd>
    </dl></section>
    <section><h2>לשיחה הבאה</h2><ul class="q">${next || '<li class="muted">אין נקודות פתוחות.</li>'}</ul></section>
  </div></div>`;
}

let shownWindow = '';
function renderWindow() {
  const { open } = route();
  const card = open && state.ready && state.cards.find((c) => c.id === open);
  const html = card
    ? windowHtml(traineeWindow(card, {
      skills: state.meta.skills, preset: state.meta.preset, teams: state.teams, evidence: state.evidence, today: localToday(), talk: talkOf(),
    }))
    : '';
  if (html === shownWindow) return; // unchanged: leave the DOM alone
  // A live update redraws the window: keep its focus and scroll where they were.
  const focused = win.contains(document.activeElement) ? document.activeElement.id : null;
  const scrolled = win.firstElementChild?.scrollTop ?? 0;
  const opening = !shownWindow && html;
  shownWindow = html;
  win.innerHTML = html;
  document.body.classList.toggle('locked', Boolean(html));
  app.inert = Boolean(html); // the window is modal: nothing behind it takes focus or clicks
  if (!html) return;
  win.firstElementChild.scrollTop = opening ? 0 : scrolled;
  document.getElementById(opening ? 'win-close' : focused)?.focus();
}

// After the window closes, focus goes back to the circle that opened it, once the circles are drawn.
let returnTo = null;

function render() {
  renderWindow();
  if (state.failed) return note('מעקב חניכים', 'החיבור לנתונים נקטע. רענן את העמוד.');
  if (!state.ready) return;
  const { cards } = state;
  const cycle = state.meta.cycle;
  if (!cycle) return note('מעקב חניכים', 'המעקב עוד לא הוקם. הרץ /student-tracker:setup ב-Claude Code.');
  if (cycle.setup !== 'done') return note(cycle.name, 'ההקמה עדיין בתהליך. העמוד יתמלא כשהיא תסתיים.');
  const { file } = route();
  const fileOf = file && cards.find((c) => c.id === file);
  if (fileOf) {
    app.innerHTML = `<header class="head"><h1>${esc(fileOf.name)}</h1><span class="sub">התיק המלא עוד לא זמין בגרסה הזו.</span></header>
      <span><button class="btn plain" data-open="${esc(fileOf.id)}">חזרה לחלון</button>
      <button class="btn plain" data-home="1">לעיגולים</button></span>`;
    return;
  }
  const talk = talkOf();
  const { circles, left } = talkCircles(cards, talk, localToday());
  const { max, ticks, gradient } = talkScale(talk);

  const ring = circles.length
    ? `<ul class="ring">${circles.map((c) => `
        <li><button class="c" data-open="${esc(c.id)}" style="background:${c.color.bg};color:${c.color.ink}"
            aria-label="${esc(c.name)}, ${c.days === null ? 'טרם שיחה' : `${c.days} ימים מאז שיחה`}">
          ${c.evalStage ? `<i class="ev">${esc(c.evalStage)}</i>` : ''}
          <b>${esc(c.name)}</b><span>${c.days === null ? 'טרם שיחה' : `<bdi class="n">${c.days}</bdi> ימים`}</span>
        </button></li>`).join('')}</ul>`
    : `<p class="note">עוד אין חניכים במחזור. אפשר להוסיף בצ'אט: "תוסיף חניכה בשם נועה".</p>`;

  app.innerHTML = `
    <header class="head">
      <h1>${esc(cycle.name)}</h1>
      <span class="sub">ימים מאז השיחה האחרונה · יעד: כל ${esc(talk.target)} ימים</span>
      <div class="scale" aria-hidden="true">
        <div class="bar" style="background:linear-gradient(to left, ${gradient.join(', ')})"></div>
        <div class="ticks">${ticks.map((v) => `<span style="right:${(v / max) * 100}%">${v === max ? `${v}+` : v}</span>`).join('')}</div>
      </div>
    </header>
    ${ring}
    ${left.length ? `<p class="left">עזבו: ${left.map(esc).join(', ')}</p>` : ''}`;
  if (returnTo && !route().open) {
    document.querySelector(`[data-open="${CSS.escape(returnTo)}"]`)?.focus();
    returnTo = null;
  }
}

const go = (hash) => { location.hash = hash; };
// A window opened from a circle on this page closes by going back, so Back never reopens it;
// one opened from a link closes by dropping the hash.
let openedHere = false;
const close = () => {
  if (openedHere) history.back();
  else go('');
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-open], [data-file], [data-close], [data-home]');
  if (!t) return;
  // A click inside the window closes it only on its close button, not anywhere on the sheet.
  if (t.dataset.close && t.classList.contains('win-bg') && e.target !== t) return;
  if (t.dataset.open) { openedHere = true; go(t.dataset.open); }
  else if (t.dataset.file) go(`file:${t.dataset.file}`);
  else if (t.dataset.close) close();
  else go('');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && route().open) close(); });

// Read-only and live. Subscribes once each, and to one Trainee's Evidence while their window is
// open; never touches raw Entries or sensitive records.
const db = window.claude?.use ? await window.claude.use('db') : null;
if (!db) {
  note('מעקב חניכים', 'אין גישה לנתוני המעקב בתצוגה הזו. פתח את העמוד מחשבון ה-claude.ai שלך.');
} else {
  let pending = 4;
  const loaded = () => { if (--pending === 0) state.ready = true; render(); };
  const once = (fn) => { let first = true; return (v) => { fn(v); if (first) { first = false; loaded(); } else render(); }; };
  const failed = () => { state.failed = true; render(); };
  db.collection('meta').onSnapshot(once((snap) => {
    state.meta = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
  }), failed);
  db.doc('commander/settings').onSnapshot(once((s) => { state.settings = s.exists ? s.data() : null; }), failed);
  db.collection('trainees').onSnapshot(once((snap) => {
    state.cards = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  }), failed);
  db.collection('teams').onSnapshot(once((snap) => {
    state.teams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  }), failed);

  let watching = null;
  let stop = () => {};
  const follow = () => {
    const { open } = route();
    if (open !== watching) {
      if (watching && !open) { returnTo = watching; openedHere = false; } // closed, however it was
      stop();
      watching = open;
      state.evidence = null;
      state.evidenceFailed = false;
      stop = open
        ? db.collection(`trainees/${open}/evidence`).where('retracted', '==', false).onSnapshot((snap) => {
          state.evidence = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          render();
        }, () => { state.evidenceFailed = true; render(); })
        : () => {};
    }
    render();
  };
  window.addEventListener('hashchange', follow);
  follow();
  setInterval(render, 60 * 60 * 1000); // days roll over without any write
}
</script>
