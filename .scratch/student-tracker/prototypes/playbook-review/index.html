<title>סקירת פלייבוק בסיס</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column per batch, Skills as stacked sections, a sticky footer to approve the batch.
   Same calm greens as the tracker's dashboard. */
:root {
  --bg: #f2f3ef; --surface: #ffffff; --surface-2: #e8eae3; --fg: #1b201c; --muted: #5d665e; --line: #d3d8cd;
  --accent: #2d5b4e; --accent-ink: #ffffff; --drop: #b3261e; --edit: #8a5a00; --ok: #2f8a4a;
  --shadow: 0 1px 2px rgb(20 30 20 / .06), 0 4px 16px rgb(20 30 20 / .06);
  --display: "Secular One", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111412; --surface: #191d1a; --surface-2: #222723; --fg: #e5e9e2; --muted: #98a198; --line: #303730;
    --accent: #82bba7; --accent-ink: #0d1a15; --drop: #f06a5f; --edit: #e2ad45; --ok: #5cc27a;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111412; --surface: #191d1a; --surface-2: #222723; --fg: #e5e9e2; --muted: #98a198; --line: #303730;
  --accent: #82bba7; --accent-ink: #0d1a15; --drop: #f06a5f; --edit: #e2ad45; --ok: #5cc27a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-block: 24px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, textarea { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page { max-width: 820px; margin-inline: auto; display: grid; gap: 22px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(1.5rem, 5vw, 2rem); }
h2 { font-size: 1.25rem; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab .done { color: var(--ok); font-weight: 700; }
.tab[aria-current="page"] .done { color: inherit; }
.skill { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 6px; display: grid; gap: 4px; min-width: 0; }
.kind { font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-top: 8px; }
.items { list-style: none; margin: 0; padding: 0; display: grid; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; }
.items .item:first-child { border-top: 0; }
.text { min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.chip { font-size: .72rem; color: var(--muted); background: var(--surface-2); border-radius: 3px; padding: 0 6px; white-space: nowrap; }
.acts { display: inline-flex; gap: 6px; }
.act { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 10px; font-size: .82rem; cursor: pointer; white-space: nowrap; }
.act[aria-pressed="true"].drop { background: var(--drop); border-color: var(--drop); color: #fff; }
.act[aria-pressed="true"].edit { background: var(--edit); border-color: var(--edit); color: #fff; }
.item.dropped .text { text-decoration: line-through; color: var(--muted); }
.rewrite { grid-column: 1 / -1; display: grid; gap: 6px; }
.rewrite textarea { width: 100%; min-height: 3.2em; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--bg); resize: vertical; }
.hint { font-size: .78rem; color: var(--muted); }
.bar {
  position: fixed; inset: auto 0 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .in { max-width: 820px; margin-inline: auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.counts { font-size: .88rem; color: var(--muted); }
.approve { border: 0; border-radius: 8px; padding: 7px 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.approve[aria-pressed="true"] { background: var(--ok); color: #fff; }
.note { display: grid; gap: 6px; }
.note textarea { width: 100%; min-height: 4em; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); resize: vertical; }
.msg { color: var(--muted); }
@media (max-width: 520px) { .item { grid-template-columns: minmax(0, 1fr); } }
</style>

<main class="page" dir="rtl" lang="he">
  <header>
    <h1>סקירת פלייבוק בסיס</h1>
    <p class="lead">הפריטים שהסוכן מציע לפי מיומנות: סימנים, טיפים למפקד, תרגולים לחניך ושאלות לשיחה. כל פריט נכנס כמו שהוא, אלא אם סימנת "להוריד" או כתבת ניסוח אחר. כשסיימת שלב, לחץ "מאשר את השלב".</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="שלבים"></nav>
  <section id="batch" aria-live="polite"><p class="msg">טוען את הפריטים…</p></section>
</main>
<div class="bar" dir="rtl" lang="he" id="bar" hidden><div class="in">
  <span class="counts" id="counts"></span>
  <button class="approve" id="approve" aria-pressed="false">מאשר את השלב</button>
</div></div>

<script type="module">
const KINDS = [['sign', 'סימנים'], ['tip', 'טיפים למפקד'], ['exercise', 'תרגולים לחניך'], ['question', 'שאלות לשיחה']];
const BANDS = { low: 'דירוג 1–2', mid: 'דירוג 3', high: 'דירוג 4–5' };
const state = { data: null, marks: {}, batches: {}, db: null, failed: '' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const $ = (id) => document.getElementById(id);
const current = () => {
  const ids = state.data?.batches.map((b) => b.id) ?? [];
  const h = location.hash.slice(1);
  return ids.includes(h) ? h : ids[0];
};
const skillName = (id) => state.data.skillNames[id] ?? (id === 'general' ? 'כללי' : id);

function itemHtml(it, skillId) {
  const m = state.marks[it.id];
  const others = it.skills.filter((s) => s !== skillId);
  const dropped = m?.verdict === 'drop';
  const editing = m?.verdict === 'edit';
  return `<li class="item${dropped ? ' dropped' : ''}" data-id="${esc(it.id)}">
    <div class="text">${esc(it.text)}
      <div class="meta">${it.band ? `<span class="chip">${BANDS[it.band]}</span>` : ''}${others.length ? `<span class="chip">גם: ${others.map((s) => esc(skillName(s))).join(', ')}</span>` : ''}</div>
    </div>
    <span class="acts">
      <button class="act drop" data-act="drop" aria-pressed="${dropped}">להוריד</button>
      <button class="act edit" data-act="edit" aria-pressed="${editing}">לנסח אחרת</button>
    </span>
    ${editing ? `<div class="rewrite"><label class="hint" for="rw-${esc(it.id)}">הניסוח שלך (נשמר כשיוצאים מהתיבה)</label>
      <textarea id="rw-${esc(it.id)}" data-rewrite="${esc(it.id)}">${esc(m.text ?? it.text)}</textarea></div>` : ''}
  </li>`;
}

function render() {
  if (!state.data) { $('batch').innerHTML = `<p class="msg">${esc(state.failed || 'טוען את הפריטים…')}</p>`; return; }
  const id = current();
  const batch = state.data.batches.find((b) => b.id === id);
  $('tabs').innerHTML = state.data.batches.map((b) => `<button class="tab" data-tab="${b.id}" ${b.id === id ? 'aria-current="page"' : ''}>${esc(b.name)}${state.batches[b.id]?.approved ? '<span class="done" aria-label="אושר">✓</span>' : ''}</button>`).join('');
  const items = state.data.items.filter((it) => it.batch === id);
  const sections = batch.skills.map((sid) => {
    const mine = items.filter((it) => it.skills[0] === sid);
    if (!mine.length) return '';
    const kinds = KINDS.map(([k, label]) => {
      const list = mine.filter((it) => it.kind === k);
      return list.length ? `<div class="kind">${label}</div><ul class="items">${list.map((it) => itemHtml(it, sid)).join('')}</ul>` : '';
    }).join('');
    return `<section class="skill" aria-label="${esc(skillName(sid))}"><h2>${esc(skillName(sid))}</h2>${kinds}</section>`;
  }).join('');
  const note = state.batches[id]?.note ?? '';
  $('batch').innerHTML = `<div style="display:grid;gap:14px">${sections}
    <div class="note"><label for="note-${id}"><b>הערה כללית לשלב</b> <span class="hint">(למשל: "יותר מדי טיפים כלליים", "חסר משהו על…")</span></label>
    <textarea id="note-${id}" data-note="${id}">${esc(note)}</textarea></div></div>`;
  const ms = items.map((it) => state.marks[it.id]).filter(Boolean);
  $('counts').textContent = `${items.length} פריטים · ${ms.filter((m) => m.verdict === 'drop').length} להוריד · ${ms.filter((m) => m.verdict === 'edit').length} בניסוח אחר`;
  const approved = Boolean(state.batches[id]?.approved);
  $('approve').setAttribute('aria-pressed', String(approved));
  $('approve').textContent = approved ? 'השלב אושר ✓ (לחיצה מבטלת)' : 'מאשר את השלב';
  $('approve').disabled = !state.db;
  $('bar').hidden = false;
}

// Saves one item's mark; no mark = the item ships as written.
async function mark(id, verdict, text) {
  if (!state.db) return;
  const ref = state.db.collection('marks').doc(id);
  try {
    if (!verdict) await ref.delete();
    else await ref.set({ verdict, ...(verdict === 'edit' ? { text: text ?? state.marks[id]?.text ?? state.data.items.find((i) => i.id === id).text } : {}), at: new Date().toISOString() });
  } catch { state.failed = 'השמירה נכשלה. רענן את העמוד ונסה שוב.'; }
}

document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { location.hash = tab.dataset.tab; return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    const id = act.closest('[data-id]').dataset.id;
    const now = state.marks[id]?.verdict;
    const next = now === act.dataset.act ? null : act.dataset.act;
    state.marks[id] = next ? { ...state.marks[id], verdict: next } : undefined;
    if (!next) delete state.marks[id];
    render();
    mark(id, next);
    if (next === 'edit') document.getElementById(`rw-${id}`)?.focus();
    return;
  }
  if (e.target.id === 'approve' && state.db) {
    const id = current();
    const approved = !state.batches[id]?.approved;
    state.batches[id] = { ...state.batches[id], approved };
    render();
    state.db.collection('batches').doc(id).set({ ...state.batches[id], approved, at: new Date().toISOString() }).catch(() => {});
  }
});
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t.dataset?.rewrite) {
    const id = t.dataset.rewrite;
    if (state.marks[id]?.text === t.value) return;
    state.marks[id] = { verdict: 'edit', text: t.value };
    mark(id, 'edit', t.value);
  } else if (t.dataset?.note && state.db) {
    const id = t.dataset.note;
    if ((state.batches[id]?.note ?? '') === t.value) return;
    state.batches[id] = { ...state.batches[id], note: t.value };
    state.db.collection('batches').doc(id).set({ ...state.batches[id], at: new Date().toISOString() }).catch(() => {});
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

try {
  const r = await fetch('items.json');
  state.data = await r.json();
} catch { state.failed = 'לא הצלחתי לטעון את הפריטים.'; }
render();

const db = window.claude?.use ? await window.claude.use('db') : null;
if (!db) {
  state.failed = '';
  const lead = document.querySelector('.lead');
  lead.textContent += ' (בתצוגה הזו אי אפשר לשמור סימונים: פתח את העמוד מחשבון ה-claude.ai שלך.)';
} else {
  state.db = db;
  // While a textarea is being typed in, a live update must not redraw it under the cursor.
  const typing = () => document.activeElement?.tagName === 'TEXTAREA';
  db.collection('marks').onSnapshot((snap) => {
    state.marks = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
    if (!typing()) render();
  }, () => {});
  db.collection('batches').onSnapshot((snap) => {
    state.batches = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
    if (!typing()) render();
  }, () => {});
}
render();
</script>
