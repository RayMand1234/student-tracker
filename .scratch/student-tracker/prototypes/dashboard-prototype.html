<title>אב-טיפוס מעקב חניכים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throwaway. Ticket 08 "How should the dashboard artifact look and behave?"
  Three structurally different dashboard variants on one page, switchable via #variant-a/b/c
  and the floating bar. Fake Trainees only. Data follows the ticket-09 shape: Trainee cards
  (current state + counting Assessments [[date, score, author]] + n per Skill) and per-Trainee
  Evidence / status changes. Rating, Trend and stale are computed here at render time.
-->

<style>
/* Layout: a field-office board. Olive-biased neutrals, deep pine accent, the 1–5 Rating ramp is the only loud color. */
:root {
  --bg: #f2f3ef; --surface: #ffffff; --surface-2: #e8eae3; --fg: #1b201c; --muted: #5d665e; --line: #d3d8cd;
  --accent: #2d5b4e; --accent-ink: #ffffff;
  --good: #2f8a4a; --watch: #b97c06; --concern: #b3261e;
  --r0: #d6d9d1; --r0-ink: #7a8079;
  --r1: #6b0e17; --r2: #c43a2c; --r3: #e6a21a; --r4: #7dc142; --r5: #10bf4c;
  --r1-ink: #ffffff; --r2-ink: #ffffff; --r3-ink: #2a1f05; --r4-ink: #13240a; --r5-ink: #ffffff;
  --shadow: 0 1px 2px rgb(20 30 20 / .06), 0 4px 16px rgb(20 30 20 / .06);
  --s1: #2a78d6; --down: #e34948; --cmp: #898781; --grid: #e3e6de; --axis: #c3c8bc;
  --display: "Secular One", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111412; --surface: #191d1a; --surface-2: #222723; --fg: #e5e9e2; --muted: #98a198; --line: #303730;
  --accent: #82bba7; --accent-ink: #0d1a15;
  --good: #5cc27a; --watch: #e2ad45; --concern: #f06a5f;
  --r0: #343a35; --r0-ink: #8c958c;
  --r1: #8c1d27; --r2: #d24a3b; --r3: #e9a925; --r4: #7fc64a; --r5: #1fd660;
  --r1-ink: #ffffff; --r2-ink: #ffffff; --r3-ink: #241a03; --r4-ink: #10200a; --r5-ink: #062410;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  --s1: #3987e5; --down: #e66767; --cmp: #898781; --grid: #2a2f2b; --axis: #3a403b;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111412; --surface: #191d1a; --surface-2: #222723; --fg: #e5e9e2; --muted: #98a198; --line: #303730;
  --accent: #82bba7; --accent-ink: #0d1a15;
  --good: #5cc27a; --watch: #e2ad45; --concern: #f06a5f;
  --r0: #343a35; --r0-ink: #8c958c;
  --r1: #8c1d27; --r2: #d24a3b; --r3: #e9a925; --r4: #7fc64a; --r5: #1fd660;
  --r1-ink: #ffffff; --r2-ink: #ffffff; --r3-ink: #241a03; --r4-ink: #10200a; --r5-ink: #062410;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  --s1: #3987e5; --down: #e66767; --cmp: #898781; --grid: #2a2f2b; --axis: #3a403b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
#app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 110px; max-width: 1480px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.proto-banner { font-size: .78rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 4px 10px; display: inline-block; }

/* shared atoms */
.rc { display: inline-grid; place-items: center; width: 30px; height: 26px; border-radius: 4px; font-family: var(--mono); font-weight: 600; font-size: .85rem; position: relative; flex: none; }
.rc.r0 { background: var(--r0); color: var(--r0-ink); }
.rc.r1 { background: var(--r1); color: var(--r1-ink); } .rc.r2 { background: var(--r2); color: var(--r2-ink); }
.rc.r3 { background: var(--r3); color: var(--r3-ink); } .rc.r4 { background: var(--r4); color: var(--r4-ink); }
.rc.r5 { background: var(--r5); color: var(--r5-ink); }
.rc .tr { position: absolute; inset-block-start: -7px; inset-inline-start: -5px; font-style: normal; font-size: .7rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 50%; width: 15px; height: 15px; display: grid; place-items: center; line-height: 1; }
.rc.stale { opacity: .38; }
.rc.thin { background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgb(255 255 255 / .38) 4px 6px); }
.rc.cmd::after { content: ""; position: absolute; inset-block-end: 2px; inset-inline-end: 2px; width: 6px; height: 6px; border-radius: 1px; background: currentColor; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.watch { color: var(--watch); } .pill.concern { color: var(--concern); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.good { background: var(--good); } .dot.watch { background: var(--watch); } .dot.concern { background: var(--concern); } .dot.left { background: var(--r0); }
.evtag { font-size: .72rem; font-weight: 700; background: var(--concern); color: #fff; padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.days { font-family: var(--mono); font-size: .8rem; padding: 1px 7px; border-radius: 4px; white-space: nowrap; }
.days.g { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.days.y { background: color-mix(in srgb, var(--watch) 22%, transparent); color: var(--watch); }
.days.r { background: color-mix(in srgb, var(--concern) 18%, transparent); color: var(--concern); }
.kind { font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 3px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.assess { font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.redact { background: var(--surface-2); color: var(--muted); border-radius: 3px; padding: 0 4px; font-size: .9em; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 11px; font-size: .8rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.feed li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.feed li:last-child { border-bottom: 0; }
.feed .when { font-family: var(--mono); font-size: .78rem; color: var(--muted); padding-top: 2px; }
.feed .what { min-width: 0; display: grid; gap: 3px; }
.feed .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feed .ex { margin: 0; }
.retracted-note { font-size: .75rem; color: var(--muted); }
.hist { display: block; }
.sec { display: grid; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* floating switcher (prototype chrome, not part of the design) */
#switcher { position: fixed; inset-block-end: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: #0b0d0c; color: #f4f4f0; box-shadow: 0 8px 30px rgb(0 0 0 / .35); font-size: .82rem; max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; direction: rtl; }
#switcher button { background: transparent; border: 0; color: inherit; padding: 4px 10px; border-radius: 999px; cursor: pointer; }

#switcher .sep { width: 1px; height: 18px; background: #3a3f3b; }

/* ================= Variant A: action board ================= */
.A { display: grid; gap: 22px; }
.A-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.A-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.A-stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.A-stat b { font-family: var(--mono); font-size: 1.6rem; font-weight: 600; line-height: 1.1; }
.A-stat .sub { font-size: .78rem; color: var(--muted); }
.A-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }

.A-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.A-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .A-split { grid-template-columns: 1fr; } }
.A-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.A-talk { display: grid; grid-template-columns: 7.5em 1fr 4.5em; gap: 10px; align-items: center; padding: 4px 0; cursor: pointer; border: 0; background: none; text-align: start; width: 100%; }
.A-talk:hover .A-name { text-decoration: underline; }
.A-meter { height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; overflow: hidden; }
.A-meter i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 4px; }
.A-meter .tick { position: absolute; inset-block: -2px; width: 1px; background: var(--muted); opacity: .5; }
.A-attn { display: grid; gap: 10px; }
.A-attn button { text-align: start; background: var(--surface-2); border: 0; border-radius: 6px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.A-attn button[data-s="concern"] { box-shadow: inset -4px 0 0 var(--concern); }
.A-attn button[data-s="watch"] { box-shadow: inset -4px 0 0 var(--watch); }
.A-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.A-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; cursor: pointer; text-align: start; }
.A-card:hover { border-color: var(--accent); }
.A-card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.A-bars { display: grid; gap: 4px; }
.A-bar { display: grid; grid-template-columns: 6.6em 1fr 1.6em; gap: 6px; align-items: center; font-size: .75rem; color: var(--muted); }
.A-bar .track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.A-bar .track i { display: block; height: 100%; border-radius: 3px; }
.A-left { opacity: .55; }
.A-weak { display: flex; flex-wrap: wrap; gap: 8px; }
.A-weak span { background: color-mix(in srgb, var(--r2) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--r2) 40%, transparent); border-radius: 6px; padding: 4px 10px; font-size: .84rem; }
.A-sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 40; display: grid; justify-items: center; align-items: start; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 100px max(12px, env(safe-area-inset-left, 0px)); }
.A-sheet { background: var(--bg); border-radius: 10px; width: min(860px, 100%); padding: 20px; display: grid; gap: 18px; box-shadow: var(--shadow); }
.A-sheet .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .A-sheet .cols { grid-template-columns: 1fr; } }
.closeX { background: var(--surface-2); border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.A-grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* ================= Variant B: skill matrix ================= */
.B { display: grid; gap: 14px; }
.B-head { display: flex; gap: 10px 24px; flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
.B-line { font-size: .95rem; }
.B-line b { font-family: var(--mono); }
.B-wrap { overflow: auto; max-height: calc(100vh - 210px); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.mx { border-collapse: separate; border-spacing: 0; font-size: .8rem; }
.mx th, .mx td { padding: 3px; text-align: center; border-bottom: 1px solid var(--line); background: var(--surface); }
.mx thead th { position: sticky; top: 0; z-index: 2; vertical-align: bottom; }
.mx thead tr.stages th { top: 0; font-family: var(--display); font-weight: 400; font-size: .92rem; padding: 8px 4px; border-inline-start: 2px solid var(--line); }
.mx thead tr.skills th { top: 40px; height: 150px; }
.mx thead tr.skills th span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 500; color: var(--muted); display: inline-block; max-height: 140px; overflow: hidden; text-overflow: ellipsis; }
.mx th.weak span { color: var(--r2) !important; font-weight: 700 !important; }
.mx .first { position: sticky; inset-inline-start: 0; z-index: 3; text-align: start; padding-inline: 10px; min-width: 210px; border-inline-end: 1px solid var(--line); }
.mx thead .first { z-index: 4; }
.mx .gstart { border-inline-start: 2px solid var(--line); }
.mx td.c { cursor: pointer; }
.mx td.c:hover .rc { outline: 2px solid var(--fg); outline-offset: 1px; }
.mx td.c.sel .rc { outline: 3px solid var(--accent); outline-offset: 1px; }
.mx tr.team td { background: var(--surface-2); font-weight: 600; }
.mx tr.left td { opacity: .45; }
.mx .nm { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.mx .nm button { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.mx .nm button:hover { text-decoration: underline; }
.mx .avg { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.B-drawer { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(420px, 100vw); background: var(--surface); z-index: 45; box-shadow: var(--shadow); border-inline-start: 1px solid var(--line); padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 110px; overflow-y: auto; display: grid; gap: 16px; align-content: start; }
.B-big { display: flex; gap: 12px; align-items: center; }
.B-big .rc { width: 54px; height: 46px; font-size: 1.3rem; }

/* ================= Variant C: Trainee file ================= */
.C { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .C { grid-template-columns: 1fr; } }
.C-nav { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); display: grid; gap: 14px; }
.C-list { display: grid; gap: 2px; }
.C-list h3 { font-size: .8rem; color: var(--muted); letter-spacing: .04em; margin-block: 8px 2px; font-family: var(--body); font-weight: 600; }
.C-item { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: none; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; text-align: start; width: 100%; }
.C-item:hover { background: var(--surface-2); }
.C-item[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.C-item[aria-current="true"] .days { background: rgb(255 255 255 / .2); color: inherit; }
.C-item .nm { display: inline-flex; gap: 7px; align-items: center; font-weight: 600; }
@media (max-width: 820px) { .C-nav { position: static; } .C-list { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; } .C-list h3 { display: none; } .C-item { width: auto; flex: none; border: 1px solid var(--line); } }
.C-main { display: grid; gap: 26px; min-width: 0; }
.C-hdr { display: grid; gap: 8px; }
.C-hdr .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.C-snap { font-size: 1.05rem; max-width: 70ch; margin: 0; }
.C-two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 640px) { .C-two { grid-template-columns: 1fr; } }
.C-two ul, .C-fu { margin: 0; padding-inline-start: 18px; display: grid; gap: 4px; }
.C-stage { display: grid; gap: 4px; }
.C-stage h3 { display: flex; gap: 10px; align-items: baseline; }
.C-sk { display: grid; grid-template-columns: minmax(0, 14em) 34px minmax(0, 1fr) 4.5em; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.C-sk .lbl { font-size: .88rem; }
.C-sk .n { font-family: var(--mono); font-size: .75rem; color: var(--muted); text-align: end; }
@media (max-width: 560px) { .C-sk { grid-template-columns: minmax(0,1fr) 34px 4em; } .C-sk .hist { display: none; } }
.C-stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 18px 28px; }
.C-teamstage { display: grid; gap: 8px; }
.C-tsrow { display: grid; grid-template-columns: 8em 1fr 2.4em; gap: 10px; align-items: center; }
.C-tsrow .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.C-tsrow .track i { display: block; height: 100%; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }

/* ================= Variant D: Talk circles (Commander's design) ================= */
.D { display: grid; gap: 28px; justify-items: center; text-align: center; }
.D-head { display: grid; gap: 6px; justify-items: center; }
.D-scale { display: grid; gap: 4px; width: min(420px, 100%); }
.D-scale .bar { height: 10px; border-radius: 5px; }
.D-scale .ticks { position: relative; height: 1.2em; font-size: .75rem; color: var(--muted); font-family: var(--mono); }
.D-scale .ticks span { position: absolute; transform: translateX(50%); white-space: nowrap; }
.D-ring { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 3vw, 26px); max-width: 860px; padding-block: 8px; }
.D-c { width: clamp(104px, 26vw, 136px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-content: center; gap: 2px; padding: 8px; box-shadow: var(--shadow); transition: transform .15s ease; position: relative; }
.D-c:hover { transform: scale(1.05); }
.D-c b { font-family: var(--display); font-weight: 400; font-size: clamp(1.05rem, 3.6vw, 1.3rem); line-height: 1.1; }
.D-c span { font-family: var(--mono); font-size: .8rem; opacity: .9; }
.D-c .ev { position: absolute; inset-block-start: 4px; left: 50%; transform: translateX(-50%); font-family: var(--body); font-size: .66rem; font-weight: 700; background: var(--surface); color: var(--concern); padding: 0 6px; border-radius: 3px; opacity: 1; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .D-c { transition: none; } .D-c:hover { transform: none; } }
.D-left { font-size: .82rem; color: var(--muted); }
.D-bg { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .5); display: grid; justify-items: center; align-items: start; overflow-y: auto; padding: calc(28px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 100px max(12px, env(safe-area-inset-left, 0px)); }
.D-modal { background: var(--bg); width: min(760px, 100%); border-radius: 12px; box-shadow: var(--shadow); display: grid; gap: 20px; padding: 0 0 22px; overflow: hidden; text-align: start; }
.D-modal > .top { padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.D-modal > section { padding-inline: 22px; display: grid; gap: 8px; }
.D-modal h2 { font-size: 1.05rem; }

  const last = s => { for (let i = s.vals.length - 1; i >= 0; i--) if (s.vals[i] != null) return [i, s.vals[i]]; return null; };

      <div><span class="assess">הערכה</span> <span class="small muted">תמונת מצב · ${fmt(t.snapshot.at)}</span><p class="C-snap" style="margin-top:4px">${redact(t.snapshot.text)}</p></div></section>
    ${growthC(t)}
    <section class="C-two">
      <div class="panel"><h2>שיפור</h2><ul>${t.items.filter(i => i.k === 'improve').map(i => `<li>${esc(i.text)}${i.s ? ' <span class="assess">הצעה</span>' : ''}</li>`).join('') || '<li class="muted">—</li>'}</ul></div>
      <div class="panel"><h2>שימור</h2><ul>${t.items.filter(i => i.k === 'keep').map(i => `<li>${esc(i.text)}${i.s ? ' <span class="assess">הצעה</span>' : ''}</li>`).join('') || '<li class="muted">—</li>'}</ul></div>
    </section>
    ${t.followups.length ? `<section class="panel"><h2>נקודות פתוחות</h2><ul class="C-fu" style="margin-top:6px">${t.followups.map(f => `<li>${esc(f.text)} <span class="small muted">מ-${fmt(f.at)}</span></li>`).join('')}</ul></section>` : ''}
    <section class="sec"><div class="sec-head"><h2>מיומנויות לאורך המחזור</h2>${legend()}</div>
      <div class="C-stages">${STAGES.map(st => { const v = stageAvg(t, st); return `<div class="C-stage"><h3>${st.name} <span class="num small muted">${v ? v.toFixed(1) : '—'}</span></h3>
        ${st.skills.map(([sid, nm]) => { const c = cellOf(t, sid); return `<div class="C-sk"><span class="lbl">${esc(nm)}</span>${rc(c)}${c ? histSvg(c.hist) : '<span class="hist small muted">אין תיעוד</span>'}<span class="n">${c ? c.n + ' תיעוד' + (c.n > 1 ? 'ים' : '') : ''}</span></div>`; }).join('')}</div>`; }).join('')}</div>
      <p class="small muted">קו הזמן: ימין = תחילת המחזור (${fmt(META.cycle.start)}), שמאל = היום. עיגול = הסוכן, ריבוע = מפקד.</p></section>
    <section class="sec"><h2>ציר זמן</h2>${feedFilterChips(ev, 'c')}<div class="panel">${feedHTML(filtered(ev), false)}</div></section>`;
}

// ================= Variant D: Talk circles (Commander's design) =================
// Continuous green → red by days since last Talk, anchored on the Commander's thresholds:
// 0 days green, target lime, yellow threshold amber, +7 red, +14 deep red. Never talked = deepest.
function talkColor(d) {
  const T = META.settings.target, Y = META.settings.yellow;
  const stops = [[0, 140, 55, 38], [T, 78, 62, 42], [Y, 38, 88, 48], [Y + 7, 6, 72, 46], [Y + 14, 355, 70, 30]];
  const x = d === null ? Y + 14 : Math.min(d, Y + 14);
  let i = 0; while (i < stops.length - 2 && x > stops[i + 1][0]) i++;
  const [a, b] = [stops[i], stops[i + 1]], f = (x - a[0]) / (b[0] - a[0] || 1);
  let h = a[1] + ((b[1] > 180 && a[1] < 180 ? b[1] - 360 : b[1]) - a[1]) * f; if (h < 0) h += 360;
  const s = a[2] + (b[2] - a[2]) * f, l = a[3] + (b[3] - a[3]) * f;
  return { bg: `hsl(${h.toFixed(0)} ${s.toFixed(0)}% ${l.toFixed(0)}%)`, ink: h > 30 && h < 100 && l > 40 ? '#1d1a0c' : '#ffffff' };
}
let dOpen = null;
function VariantD() {
  const A = active().slice().sort((a, b) => (talkDays(b) ?? 999) - (talkDays(a) ?? 999));
  const Y = META.settings.yellow, max = Y + 14;
  const grad = Array.from({ length: 11 }, (_, i) => talkColor(i / 10 * max).bg).join(', ');
  const left = TRAINEES.filter(t => t.left);
  return `<div class="D">
    <header class="D-head"><span class="proto-banner">אב-טיפוס · נתוני דמה</span><h1>${META.cycle.name}</h1><span class="muted">שבוע ${WEEK} מתוך ${META.cycle.weeks} · ימים מאז השיחה האחרונה</span>
      <div class="D-scale" aria-hidden="true"><div class="bar" style="background:linear-gradient(to left, ${grad})"></div>
        <div class="ticks">${[0, META.settings.target, Y, Y + 7, max].map(v => `<span style="right:${v / max * 100}%">${v === max ? v + '+' : v}</span>`).join('')}</div></div></header>
    <div class="D-ring">${A.map(t => { const d = talkDays(t), c = talkColor(d); return `<button class="D-c" data-dopen="${t.id}" style="background:${c.bg};color:${c.ink}" aria-label="${esc(t.name)}, ${d === null ? 'טרם נערכה שיחה' : d + ' ימים מאז שיחה'}">${t.evalStage ? `<i class="ev">${esc(t.evalStage)}</i>` : ''}<b>${esc(t.name)}</b><span>${d === null ? 'טרם' : d + ' ימים'}</span></button>`; }).join('')}</div>
    ${left.length ? `<p class="D-left">עזבו: ${left.map(t => esc(t.name)).join(', ')}</p>` : ''}
    ${dOpen ? modalD(TRAINEES.find(t => t.id === dOpen)) : ''}
  </div>`;
}
function modalD(t) {
  const ev = evidenceOf(t), d = talkDays(t), c = talkColor(d), x = EXTRA[t.id] || { q: [] };
  const goal = ev.find(e => e.kind === 'goal'), bg = ev.find(e => e.kind === 'background');
  return `<div class="D-bg" data-dclose="1"><div class="D-modal" role="dialog" aria-modal="true" aria-label="${esc(t.name)}">
    <div class="top" style="background:${c.bg};color:${c.ink}"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1>${esc(t.name)}</h1>${t.evalStage ? `<span class="evtag" style="background:var(--surface);color:var(--concern)">${esc(t.evalStage)}</span>` : ''}</div>
      <span style="display:inline-flex;gap:8px"><button class="closeX" data-file="${t.id}" style="background:rgb(255 255 255 / .85);color:#1b201c">לתיק המלא</button><button class="closeX" data-dclose="1" style="background:rgb(255 255 255 / .85);color:#1b201c">סגירה</button></span></div>
    <section><h2>תמונת מצב <span class="assess">הערכה</span></h2><p style="margin:0;max-width:65ch">${redact(t.snapshot.text)}</p></section>
    <section><h2>מיומנויות</h2><div class="D-sk">${STAGES.map(st => { const rated = st.skills.filter(([sid]) => cellOf(t, sid)); const none = st.skills.length - rated.length; return `<div class="st"><span class="small muted">${st.name}</span><div class="row">${rated.map(([sid, nm]) => `<span class="one">${rc(cellOf(t, sid))}${esc(nm)}</span>`).join('')}${none ? `<span class="one muted small">${rated.length ? '+' : ''}${none} ללא תיעוד</span>` : ''}</div></div>`; }).join('')}</div>${legend()}</section>
    <section><h2>פרטים</h2><dl class="D-info">
      <dt>סטטוס</dt><dd>${statusPill(t)}</dd>
      <dt>תהליך הערכה</dt><dd>${t.evalStage ? esc(t.evalStage) : '—'}</dd>
      <dt>שיחה אחרונה</dt><dd>${t.lastTalk ? fmt(t.lastTalk) + ' · ' + d + ' ימים' : 'טרם נערכה'}</dd>
      <dt>צוות פרויקט</dt><dd>${esc(x.team || '—')}</dd>
      ${goal ? `<dt>שאיפות</dt><dd>${redact(goal.ex)}</dd>` : ''}
      ${bg ? `<dt>רקע</dt><dd>${redact(bg.ex)}</dd>` : ''}
      <dt>תיעודים</dt><dd>${ev.length}, האחרון ב-${ev.length ? fmt(ev[0].date) : '—'}</dd>
    </dl></section>
    <section><h2>לשיחה הבאה</h2><ul class="D-q">
      ${t.followups.map(f => `<li><span>${esc(f.text)}</span><span class="src">נקודה פתוחה מ-${fmt(f.at)}</span></li>`).join('')}
      ${x.q.map(q => `<li><span>${esc(q)}</span><span class="src">שאלה מוצעת <span class="assess">הצעה</span></span></li>`).join('')}
      ${!t.followups.length && !x.q.length ? '<li class="muted">אין נקודות פתוחות.</li>' : ''}
    </ul></section>
  </div></div>`;
}

// ---------- switcher + wiring ----------
// Winner (Commander, 2026-10-29): Talk circles → Trainee window → full Trainee file. Losing variants: dashboard-prototype-all-variants.html
const VARIANTS = [['d', 'עיגולי שיחות', VariantD], ['c', 'תיק חניך', VariantC]];
const cur = () => { const m = location.hash.match(/^#variant-([cd])$/); return m ? m[1] : 'd'; };
function go(k) { feedFilter = 'all'; location.hash = 'variant-' + k; }
function render() {
  const v = VARIANTS.find(x => x[0] === cur());
  document.getElementById('app').innerHTML = v[2]();
  const i = VARIANTS.indexOf(v);
  document.getElementById('switcher').hidden = true;
}
function step(d) { const i = VARIANTS.findIndex(x => x[0] === cur()); go(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]); }
document.addEventListener('click', e => {
  const q = s => e.target.closest(s);
  if (q('#sw-prev')) return step(-1);
  if (q('#sw-next')) return step(1);
  if (q('#sw-theme')) { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; return; }
  const ft = q('[data-feedfilter] .chip'); if (ft) { feedFilter = ft.dataset.k; return render(); }
  if (cur() === 'd') {
    const fl = q('[data-file]'); if (fl) { dOpen = null; cSel = fl.dataset.file; go('c'); window.scrollTo({ top: 0 }); return; }
    if (q('.closeX[data-dclose]') || e.target.dataset.dclose) { dOpen = null; return render(); }
    const o = q('[data-dopen]'); if (o) { dOpen = o.dataset.dopen; return render(); }
  }
  if (cur() === 'a') {
    const tab = q('[data-atab]'); if (tab) { aTab = tab.dataset.atab; feedFilter = 'all'; return render(); }
    if (q('[data-close]') && (e.target.dataset.close || q('.closeX'))) { aOpen = null; return render(); }
    const o = q('[data-open]'); if (o) { aOpen = o.dataset.open; return render(); }
  }
  if (cur() === 'b') {
    if (q('[data-bclose]')) { bSel = null; return render(); }
    const c = q('[data-cell]'); if (c) { const [tid, sid] = c.dataset.cell.split('|'); bSel = { tid, sid }; return render(); }
    const o = q('[data-open]'); if (o) { bSel = { tid: o.dataset.open }; return render(); }
  }
  if (cur() === 'c' && q('[data-home]')) { go('d'); window.scrollTo({ top: 0 }); return; }
  if (cur() === 'c') { const c = q('[data-c]'); if (c) { cSel = c.dataset.c; feedFilter = 'all'; render(); window.scrollTo({ top: 0 }); return; } }
});
document.addEventListener('change', e => {
  if (e.target.id === 'opt-cmd') { OPT.cmd = e.target.checked; render(); }
  if (e.target.id === 'opt-thin') { OPT.thin = e.target.checked; render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'Escape') { aOpen = null; bSel = null; dOpen = null; render(); }
});
// one tooltip for every chart: crosshair on line charts, per-row on the movers bars
const tip = document.getElementById('tip');
function showTip(lines, cx, cy) {
  tip.replaceChildren(...lines.map(([txt, color], i) => {
    const s = document.createElement('span'); s.style.display = 'flex'; s.style.gap = '6px'; s.style.alignItems = 'center';
    if (color) { const k = document.createElement('i'); k.style.cssText = `width:12px;height:2px;border-radius:1px;background:${color}`; s.append(k); }
    s.append(document.createTextNode(txt)); if (i === 0) s.style.fontWeight = '600'; return s;
  }));
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - r.width - 8, Math.max(8, cx - r.width / 2)) + 'px';
  tip.style.top = Math.max(8, cy - r.height - 14) + 'px';
}
function hideTip() { tip.hidden = true; document.querySelectorAll('.lc .xh').forEach(l => l.setAttribute('visibility', 'hidden')); }
document.addEventListener('pointermove', e => {
  const svg = e.target.closest && e.target.closest('svg[data-lc]');
  const row = e.target.closest && e.target.closest('[data-tip]');
  if (row) { const [a, b] = row.dataset.tip.split('|'); const r = row.getBoundingClientRect(); return showTip([[a], [b]], e.clientX, r.top); }
  if (!svg) return hideTip();
  const m = JSON.parse(svg.dataset.lc), r = svg.getBoundingClientRect(), k = m.W / r.width;
  const px = (e.clientX - r.left) * k, pw = m.W - m.pl - m.pr;
  const i = Math.max(0, Math.min(WEEK - 1, Math.round((m.W - m.pr - px) / pw * (WEEK - 1))));
  const xx = m.W - m.pr - (WEEK > 1 ? i / (WEEK - 1) : 0) * pw;
  const xh = svg.querySelector('.xh'); xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.setAttribute('visibility', 'visible');
  showTip([['שבוע ' + (i + 1)], ...m.s.slice().reverse().map(s => [s.n + ': ' + f1(s.v[i]), s.c])], r.left + xx / k, r.top);
});
document.addEventListener('pointerleave', hideTip);
window.addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('hashchange', render);
render();
</script>
